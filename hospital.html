<script type="text/babel">
const {useState,useEffect,createContext,useContext,useCallback}=React;

// ═══════════════════════════════════════════════════
// BLOCKCHAIN LAYER
// ═══════════════════════════════════════════════════
const mkHash=()=>'0x'+Array.from({length:64},()=>Math.floor(Math.random()*16).toString(16)).join('');
const mkAddr=()=>'0x'+Array.from({length:40},()=>Math.floor(Math.random()*16).toString(16)).join('');
const short=h=>h?h.slice(0,6)+'…'+h.slice(-4):'';
const gweiCost=(gwei,gas)=>((gwei*gas)/1e9).toFixed(6);

// Simulated IPFS CID (content-addressed hash for files)
const mkCID=()=>{
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  return 'Qm'+Array.from({length:44},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
};
const shortCID=c=>c?c.slice(0,8)+'…'+c.slice(-6):'';

// Simple content fingerprint (not cryptographic, just for demo)
const fingerprint=str=>{
  let h=0;
  for(let i=0;i<Math.min(str.length,500);i++){h=(Math.imul(31,h)+str.charCodeAt(i))|0;}
  return Math.abs(h).toString(16).padStart(8,'0');
};

class SimChain{
  constructor(){
    this.block=7243891+Math.floor(Math.random()*50000);
    this.txs=[];this._subs={};
    this.gasPrice=12;
    this.walletAddr=mkAddr();
    this.networkName='Sepolia Testnet';
    this.chainId=11155111;
  }
  async tx(method,args={},gasEst=90000,label='Transaction'){
    await new Promise(r=>setTimeout(r,700+Math.random()*700));
    this.block++;
    const gas=Math.floor(gasEst*(0.78+Math.random()*0.44));
    const r={txHash:mkHash(),blockHash:mkHash(),blockNumber:this.block,gasUsed:gas,gasPrice:this.gasPrice,ethCost:gweiCost(this.gasPrice,gas),status:1,method,label,args,from:this.walletAddr,contractAddr:'0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0',ts:Date.now()};
    this.txs.unshift(r);
    (this._subs['*']||[]).forEach(fn=>fn(r));
    return r;
  }
  on(ev,fn){if(!this._subs[ev])this._subs[ev]=[];this._subs[ev].push(fn);}
  off(ev,fn){if(this._subs[ev])this._subs[ev]=this._subs[ev].filter(x=>x!==fn);}
  getTxs(){return[...this.txs];}
  getBlock(){return this.block;}
  getAddr(){return this.walletAddr;}
}
const SC=new SimChain();

let _mmWallet=null;
const tryMetaMask=async(setWallet)=>{
  if(!window.ethereum)return false;
  try{
    const p=new ethers.providers.Web3Provider(window.ethereum);
    await p.send('eth_requestAccounts',[]);
    const s=p.getSigner();const addr=await s.getAddress();
    const bal=await p.getBalance(addr);const net=await p.getNetwork();
    _mmWallet={address:addr,balance:parseFloat(ethers.utils.formatEther(bal)).toFixed(4),chainId:net.chainId,name:net.name,real:true};
    setWallet(_mmWallet);return true;
  }catch(e){return false;}
};

// ═══════════════════════════════════════════════════
// ICONS
// ═══════════════════════════════════════════════════
const Ico=({d,cls="w-4 h-4"})=><svg className={cls} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={d}/></svg>;
const IcoUser=({cls="w-4 h-4"})=><Ico cls={cls} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>;
const IcoLock=({cls="w-4 h-4"})=><Ico cls={cls} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>;
const IcoOut=({cls="w-4 h-4"})=><Ico cls={cls} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>;

const IcoBell=({cls="w-4 h-4"})=><Ico cls={cls} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>;
const IcoSend=({cls="w-4 h-4"})=><Ico cls={cls} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>;
const IcoPlus=({cls="w-4 h-4"})=><Ico cls={cls} d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>;
const IcoDoc=({cls="w-4 h-4"})=><Ico cls={cls} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>;
const IcoClip=({cls="w-4 h-4"})=><Ico cls={cls} d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>;
const IcoBuild=({cls="w-4 h-4"})=><Ico cls={cls} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>;
const IcoShare=({cls="w-4 h-4"})=><Ico cls={cls} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>;
const IcoChain=({cls="w-4 h-4"})=><Ico cls={cls} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>;
const IcoEth=({cls="w-4 h-4"})=><svg className={cls} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 12.5l8 4.5 8-4.5L12 2zm0 3.5l5.5 7-5.5 3-5.5-3 5.5-7zm0 12.5L4.5 14l7.5 4 7.5-4L12 18z"/></svg>;
const IcoCode=({cls="w-4 h-4"})=><Ico cls={cls} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>;
const IcoShield=({cls="w-4 h-4"})=><Ico cls={cls} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>;
const IcoDl=({cls="w-4 h-4"})=><Ico cls={cls} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>;
const IcoDb=({cls="w-4 h-4"})=><Ico cls={cls} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>;

// ═══════════════════════════════════════════════════
// BLOCKCHAIN CONTEXT
// ═══════════════════════════════════════════════════
const BCCtx=createContext(null);
const BCProvider=({children})=>{
  const [wallet,setWallet]=useState({address:SC.getAddr(),balance:'2.4581',chainId:11155111,name:'Sepolia Testnet',simulated:true});
  const [connecting,setConn]=useState(false);
  const [toasts,setToasts]=useState([]);
  const addToast=useCallback((r,label)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,r,label}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),7000);
  },[]);
  const connect=async()=>{setConn(true);const ok=await tryMetaMask(setWallet);if(!ok)setWallet(w=>({...w,simulated:true}));setConn(false);};
  const bcTx=useCallback(async(method,args,gasEst,label)=>{
    const r=await SC.tx(method,args,gasEst,label);
    addToast(r,label);return r;
  },[addToast]);
  return <BCCtx.Provider value={{wallet,connecting,connect,toasts,bcTx}}>{children}</BCCtx.Provider>;
};
const useBC=()=>useContext(BCCtx);

// ═══════════════════════════════════════════════════
// DATA STORE
// ═══════════════════════════════════════════════════
const organSystems=['Cardiovascular System','Respiratory System','Nervous System','Digestive System','Musculoskeletal System','Endocrine System','Urinary System','Reproductive System','Immune System','Integumentary System','General Medicine'];
const validatePw=p=>{const e=[];if(p.length<8)e.push('Min 8 chars');if(!/[A-Z]/.test(p))e.push('Uppercase');if(!/[a-z]/.test(p))e.push('Lowercase');if(!/[0-9]/.test(p))e.push('Number');return e;};

const D={
  users:{
    'doctor001':{id:'doctor001',username:'doctor001',password:'password123',role:'doctor',name:'Dr. Alice Smith',organization:'SAAS Hospital',portal:'hospital',specialization:'Cardiovascular System',txHash:mkHash()},
    'patient001':{id:'patient001',username:'patient001',password:'patient123',role:'patient',name:'John Doe',patientId:'patient-demo-001',portal:'patient',txHash:mkHash()},
    'clinical001':{id:'clinical001',username:'clinical001',password:'clinical123',role:'clinical',name:'Dr. Sarah Wilson',organization:'City Medical Clinic',portal:'clinic',specialization:'Respiratory System',txHash:mkHash()},
    'receptionist001':{id:'receptionist001',username:'receptionist001',password:'reception123',role:'receptionist',name:'Emma Thompson',organization:'SAAS Hospital',portal:'hospital',txHash:mkHash()},
    'nurse001':{id:'nurse001',username:'nurse001',password:'nurse123',role:'nurse',name:'Nurse Mary Johnson',organization:'SAAS Hospital',portal:'hospital',txHash:mkHash()}
  },
  patients:{
    'patient-demo-001':{id:'patient-demo-001',name:[{family:'Doe',given:['John']}],gender:'male',birthDate:'1980-01-15',telecom:[{system:'email',value:'john.doe@email.com'},{system:'phone',value:'555-0123'}],healthInfo:[],authorizedDoctors:['doctor001']}
  },
  appointments:{'patient-demo-001':[]},
  transferRequests:{'patient-demo-001':[]},
  externalDocuments:{'patient-demo-001':[]},  // keyed by patientId
  // NEW: keyed by staffUserId — all docs this staff member can access & download
  staffDocuments:{},
  auditLogs:[],
  notifications:{}
};

let _bcTx=null;
const logAudit=(u,a,d)=>{D.auditLogs.push({userId:u.id,userName:u.name,role:u.role,action:a,details:d,timestamp:new Date().toISOString()});if(_bcTx)_bcTx('emitAudit',{userId:u.id,action:a,details:d},45000,'Audit: '+a);};
const addNotif=(uid,msg)=>{if(!D.notifications[uid])D.notifications[uid]=[];D.notifications[uid].push({id:'n'+Date.now()+Math.random(),message:msg,timestamp:new Date().toISOString(),read:false});};

// Push a document into a staff member's accessible doc list (deduped)
const pushStaffDoc=(userId,doc)=>{
  if(!D.staffDocuments[userId])D.staffDocuments[userId]=[];
  if(!D.staffDocuments[userId].find(d=>d.id===doc.id))D.staffDocuments[userId].push(doc);
};

const api=async(ep,opts={})=>{
  await new Promise(r=>setTimeout(r,80));
  const method=opts.method||'GET';
  const body=opts.body?JSON.parse(opts.body):null;

  // ── Appointments ──────────────────────────────────
  if(ep.includes('/appointments')&&method==='POST'){
    const a={id:'appt'+Date.now(),...body,status:'pending'};
    if(!D.appointments[body.patientId])D.appointments[body.patientId]=[];
    D.appointments[body.patientId].push(a);
    if(_bcTx)a.txHash=(await _bcTx('bookAppointment',{patientId:body.patientId,doctorId:body.doctorId},95000,'Book Appointment')).txHash;
    return a;
  }
  if(ep.includes('/appointments')&&method==='PUT'){
    const arr=D.appointments[body.patientId]||[];
    const a=arr.find(x=>x.id===body.id);
    if(a){a.status=body.status;if(body.notes)a.notes=body.notes;if(_bcTx)a.statusTxHash=(await _bcTx('updateAppointment',{patientId:body.patientId,status:body.status},65000,'Update Appointment')).txHash;}
    return a;
  }

  // ── Patient health data ───────────────────────────
  if(ep.includes('/patient-data')&&method==='POST'){
    D.patients[body.patientId].healthInfo.push(body.healthInfo);
    if(_bcTx)body.healthInfo.txHash=(await _bcTx('addHealthInfo',{patientId:body.patientId,addedBy:body.healthInfo.addedBy},110000,'Add Health Info')).txHash;
    return{success:true};
  }

  // ── External document (patient → doctor) ──────────
  if(ep.includes('/external-document')&&method==='POST'){
    if(!D.externalDocuments[body.patientId])D.externalDocuments[body.patientId]=[];
    // Generate IPFS CID for file attachment (or doc content fingerprint)
    const cid=body.attachmentFingerprint?('Qm'+body.attachmentFingerprint.padEnd(44,'x').slice(0,44)):mkCID();
    const doc={id:'doc'+Date.now(),...body,sentAt:new Date().toISOString(),ipfsCID:cid};
    D.externalDocuments[body.patientId].push(doc);
    addNotif(body.doctorId,'📄 '+body.patientName+' sent: "'+body.documentName+'"');
    // Blockchain: record doc hash + IPFS CID
    if(_bcTx)doc.txHash=(await _bcTx('sendDocument',{patientId:body.patientId,doctorId:body.doctorId,docName:body.documentName,ipfsCID:cid,hasFile:!!body.attachment},150000,'Send Document')).txHash;
    // Give receiving doctor access to download
    pushStaffDoc(body.doctorId,doc);
    return doc;
  }

  // ── Data transfer (staff → staff) ─────────────────
  if(ep.includes('/data-transfer')&&method==='POST'){
    const t={id:'tr'+Date.now(),...body,status:'pending'};
    if(!D.transferRequests[body.patientId])D.transferRequests[body.patientId]=[];
    D.transferRequests[body.patientId].push(t);
    const docIds=(body.sharedExternalDocs||[]).map(d=>d.id);
    const fileCIDs=(body.sharedExternalDocs||[]).filter(d=>d.ipfsCID).map(d=>d.ipfsCID);
    addNotif(body.toUserId,'📦 Data transfer from '+D.users[body.fromUserId]?.name+' ('+(docIds.length)+' doc(s), sev: '+body.severity+')');
    // Blockchain: record transfer with all doc IDs + CIDs
    if(_bcTx)t.txHash=(await _bcTx('requestTransfer',{patientId:body.patientId,from:body.fromUserId,to:body.toUserId,severity:body.severity,docCount:docIds.length,docIds:docIds.join(','),fileCIDs:fileCIDs.join(',')},130000,'Data Transfer')).txHash;
    // Give recipient access to all transferred docs (with files)
    (body.sharedExternalDocs||[]).forEach(sd=>{
      const enriched={...sd,_transferredBy:body.fromUserId,_transferredByName:D.users[body.fromUserId]?.name,_transferTxHash:t.txHash,_transferId:t.id};
      pushStaffDoc(body.toUserId,enriched);
    });
    return t;
  }

  // ── Authorize doctor ──────────────────────────────
  if(ep.includes('/authorize-doctor')&&method==='POST'){
    const{patientId,doctorId}=body;
    if(!D.patients[patientId].authorizedDoctors.includes(doctorId))D.patients[patientId].authorizedDoctors.push(doctorId);
    addNotif(doctorId,'Patient '+patientId+' authorized your access.');
    if(_bcTx)await _bcTx('authorizeDoctor',{patientId,doctorId},60000,'Authorize Doctor');
    return{success:true};
  }

  // ── User management ───────────────────────────────
  if(ep.includes('/users')&&method==='POST'){
    D.users[body.username]={id:body.username,...body};
    if(_bcTx)D.users[body.username].txHash=(await _bcTx('registerUser',{userId:body.username,role:body.role,name:body.name},120000,'Register User')).txHash;
    return D.users[body.username];
  }
  if(ep.includes('/users')&&method==='PUT'){
    D.users[body.id]={...D.users[body.id],...body};
    if(_bcTx)await _bcTx('updateProfile',{userId:body.id},55000,'Update Profile');
    return D.users[body.id];
  }
  return{};
};

// ═══════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════
const AuthCtx=createContext(null);
const AuthProvider=({children})=>{
  const [user,setUser]=useState(null);
  useEffect(()=>{try{const u=JSON.parse(sessionStorage.getItem('u')||'null');if(u)setUser(u);}catch(e){}}, []);
  const login=async(un,pw)=>{
    await new Promise(r=>setTimeout(r,300));
    const u=D.users[un];
    if(!u||u.password!==pw)return{success:false,error:'Invalid credentials'};
    const ud={id:u.id,username:u.username,role:u.role,name:u.name,organization:u.organization,portal:u.portal,patientId:u.patientId,specialization:u.specialization};
    setUser(ud);sessionStorage.setItem('u',JSON.stringify(ud));
    logAudit(ud,'Login',ud.name+' logged in');
    return{success:true};
  };
  const logout=()=>{if(user)logAudit(user,'Logout',user.name+' logged out');setUser(null);sessionStorage.removeItem('u');};
  const updateUser=nu=>{const u={...user,username:nu};setUser(u);sessionStorage.setItem('u',JSON.stringify(u));};
  return <AuthCtx.Provider value={{user,login,logout,updateUser}}>{children}</AuthCtx.Provider>;
};

// Blob-based download — works reliably for all file sizes transferred via blockchain
const downloadFile=(attachment)=>{
  try{
    const binary=atob(attachment.content);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:attachment.mimeType});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=attachment.name;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){alert('Download failed: '+e.message);}
};
const DownloadBtn=({attachment,label})=>{
  if(!attachment)return null;
  return(
    <button onClick={()=>downloadFile(attachment)} className="dl-btn">
      <IcoDl cls="w-3.5 h-3.5"/>
      {label||attachment.name}
    </button>
  );
};

const ProfileManagement=()=>{
  const {user,updateUser}=useAuth();
  const [un,setUn]=useState(user.username);const [pw,setPw]=useState('');const [cpw,setCpw]=useState('');
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const save=async()=>{
    setErr(null);setOk(null);
    if(!un){setErr('Username required');return;}
    if(pw&&pw!==cpw){setErr('Passwords do not match');return;}
    if(pw){const e=validatePw(pw);if(e.length){setErr(e.join(', '));return;}}
    await api('/api/users',{method:'PUT',body:JSON.stringify({id:user.id,username:un,...(pw?{password:pw}:{})})});
    updateUser(un);logAudit(user,'Profile Update','Updated profile');
    setOk('Profile updated & recorded on-chain');setTimeout(()=>setOk(null),4000);setPw('');setCpw('');
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Profile Management</h2>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      <Card cls="p-5 space-y-3">
        <div className="flex items-center gap-2"><h3 className="font-semibold text-slate-200">Update Profile</h3><TxBadge txHash={D.users[user.id]?.txHash}/></div>
        <Inp type="text" value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" label="Username"/>
        <Inp type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Leave blank to keep current" label="New Password"/>
        <Inp type="password" value={cpw} onChange={e=>setCpw(e.target.value)} placeholder="Confirm new password" label="Confirm Password"/>
        <button onClick={save} disabled={!un} className="btn-eth">Save & Record on Chain</button>
      </Card>
    </div>
  );
};

              <div className="flex items-center justify-between p-3 rounded-lg" style={{background:'rgba(74,222,128,0.06)',border:'1px solid rgba(74,222,128,0.25)'}}>

                  <IcoClip cls="w-4 h-4 text-green-400"/>
                  <div>
                    <p className="text-sm text-green-300 font-medium">{d.attachment.name}</p>
                    <p className="text-xs text-slate-500">{d.attachment.mimeType}{d._transferredByName&&<span className="ml-2 text-teal-400">via {d._transferredByName}</span>}</p>
                  </div>
                </div>
                <button onClick={()=>downloadFile(d.attachment)} className="dl-btn">
                  <IcoDl cls="w-3.5 h-3.5"/>Download
                </button>
              </div>
            ):(
              <p className="text-xs text-slate-500 italic">No file attached to this document.</p>

};

// ═══════════════════════════════════════════════════
// SEND EXTERNAL DOCUMENT (Patient)
// ═══════════════════════════════════════════════════
const SendExternalDocument=()=>{
  const {user}=useAuth();
  const approvedAppts=(D.appointments[user.patientId]||[]).filter(a=>a.status==='approved');
  const [selAppt,setSelAppt]=useState('');const [docName,setDocName]=useState('');const [docNote,setDocNote]=useState('');
  const [refType,setRefType]=useState('hospital');const [checkedBy,setCheckedBy]=useState('');const [hospName,setHospName]=useState('');
  const [insCompany,setInsCompany]=useState('');const [insStaff,setInsStaff]=useState('');const [file,setFile]=useState(null);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [sent,setSent]=useState([...(D.externalDocuments[user.patientId]||[])]);
  const apptData=approvedAppts.find(a=>a.id===selAppt);
  const apptDoc=apptData?D.users[apptData.doctorId]:null;
  const refOk=refType==='hospital'?(hospName.trim()&&checkedBy.trim()):(insCompany.trim()&&insStaff.trim());
  const canSend=selAppt&&(docName.trim()||file)&&refOk;
  const send=async()=>{
    setErr(null);
    if(!canSend){setErr('Fill all required fields');return;}
    try{
      let att=null,fp='';
      if(file){
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
        att={name:file.name,content:b64,mimeType:file.type};
        fp=fingerprint(b64);
      }
      const referral=refType==='hospital'?{type:'hospital',hospitalName:hospName,checkedBy}:{type:'insurance',companyName:insCompany,reviewedBy:insStaff};
      await api('/api/external-document',{method:'POST',body:JSON.stringify({patientId:user.patientId,patientName:user.name,doctorId:apptData.doctorId,doctorName:apptDoc.name,doctorOrganization:apptDoc.organization,documentName:docName||(file?.name)||'Untitled',note:docNote,referral,attachment:att,attachmentFingerprint:fp})});
      logAudit(user,'Send External Document','Sent to '+apptDoc.name+(att?' with file '+att.name:''));
      setOk('Document sent · IPFS hash + Tx recorded on Ethereum');setTimeout(()=>setOk(null),5000);
      setSelAppt('');setDocName('');setDocNote('');setRefType('hospital');setCheckedBy('');setHospName('');setInsCompany('');setInsStaff('');setFile(null);
      setSent([...(D.externalDocuments[user.patientId]||[])]);
    }catch(e){setErr('Failed: '+e.message);}
  };
  return(
    <div className="space-y-6">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#627eea,#8b5cf6)'}}><IcoSend cls="w-5 h-5 text-white"/></div>
        <div><h2 className="text-xl font-bold text-white">Send Document to Doctor</h2><p className="text-sm text-slate-400">File hash (IPFS CID) stored immutably on Ethereum</p></div>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {approvedAppts.length===0?(
        <Card cls="p-6 text-center"><IcoDoc cls="w-10 h-10 text-slate-600 mx-auto mb-3"/><p className="font-medium text-slate-400">No approved appointments</p></Card>
      ):(
        <Card cls="p-5 space-y-4">
          <h3 className="font-semibold text-slate-200">Compose Document</h3>
          <div>
            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Select Appointed Doctor</label>
            <select value={selAppt} onChange={e=>setSelAppt(e.target.value)} className="inp-dark">
              <option value="">— choose —</option>
              {approvedAppts.map(a=>{const doc=D.users[a.doctorId];return<option key={a.id} value={a.id}>{doc?.name} · {new Date(a.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</option>;})}
            </select>
          </div>
          {apptDoc&&(
            <div className="flex items-center gap-3 p-3 rounded-lg" style={{background:'rgba(98,126,234,0.1)',border:'1px solid rgba(98,126,234,0.3)'}}>
              <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{background:'linear-gradient(135deg,#627eea,#8b5cf6)'}}><IcoUser cls="w-4 h-4 text-white"/></div>
              <div className="flex-1 min-w-0"><p className="font-semibold text-indigo-200 text-sm">{apptDoc.name}</p><p className="text-xs text-indigo-400">🏥 {apptDoc.organization} · 🩺 {apptDoc.specialization}</p></div>
              <span className="status-pill pill-green">Approved ✓</span>
            </div>
          )}
          <Inp type="text" value={docName} onChange={e=>setDocName(e.target.value)} placeholder="e.g. Blood Test Results" label="Document Title"/>
          <div className="border border-slate-700/50 rounded-lg overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-800/50 border-b border-slate-700/30"><p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Referral Attribution *</p></div>
            <div className="p-4 space-y-3">
              <div className="flex gap-2">
                {['hospital','insurance'].map(t=>(
                  <button key={t} type="button" onClick={()=>{setRefType(t);setCheckedBy('');setHospName('');setInsCompany('');setInsStaff('');}}
                    className={'flex-1 py-2 rounded-lg text-sm font-medium transition-colors '+(refType===t?'text-white'+(t==='hospital'?' bg-indigo-600':' bg-purple-600'):'text-slate-400 bg-slate-800/50 hover:bg-slate-700/50')}>
                    {t==='hospital'?'🏥 Hospital':'🏦 Insurance'}
                  </button>
                ))}
              </div>
              {refType==='hospital'?(
                <><Inp type="text" value={hospName} onChange={e=>setHospName(e.target.value)} placeholder="e.g. City General Hospital" label="Hospital / Clinic Name *"/><Inp type="text" value={checkedBy} onChange={e=>setCheckedBy(e.target.value)} placeholder="e.g. Dr. John Smith" label="Checked By *"/></>
              ):(
                <><Inp type="text" value={insCompany} onChange={e=>setInsCompany(e.target.value)} placeholder="e.g. MediShield Insurance" label="Insurance Company *"/><Inp type="text" value={insStaff} onChange={e=>setInsStaff(e.target.value)} placeholder="e.g. James Carter" label="Reviewed By *"/></>
              )}
            </div>
          </div>
          <div><label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Additional Notes (optional)</label><textarea value={docNote} onChange={e=>setDocNote(e.target.value)} rows={3} className="inp-dark resize-none" placeholder="Any notes for the doctor…"/></div>
          <div>
            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Attach File (optional — hash stored on Ethereum)</label>
            <input type="file" onChange={e=>setFile(e.target.files[0])} className="inp-dark text-slate-400"/>
            {file&&<p className="text-xs text-emerald-400 mt-1">📎 {file.name} · IPFS CID will be generated on submit</p>}
          </div>
          <button onClick={send} disabled={!canSend} className="btn-eth w-full justify-center"><IcoChain cls="w-4 h-4"/>Send & Record on Ethereum</button>
        </Card>
      )}
      {sent.length>0&&(
        <div className="space-y-3">
          <h3 className="font-semibold text-slate-300">Sent Documents ({sent.length})</h3>
          {sent.map(d=>(
            <Card key={d.id} cls="p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0 flex-1">
                  <p className="font-medium text-slate-200 text-sm">📄 {d.documentName}</p>
                  <div className="flex items-center gap-2 mt-1 flex-wrap"><TxBadge txHash={d.txHash}/>{d.ipfsCID&&<IPFSBadge cid={d.ipfsCID}/>}</div>
                  <p className="text-sm text-indigo-400 mt-0.5">→ {d.doctorName} · {d.doctorOrganization}</p>
                  {d.referral&&(d.referral.type==='hospital'?<p className="text-xs text-slate-500 mt-0.5">🏥 {d.referral.hospitalName} · {d.referral.checkedBy}</p>:<p className="text-xs text-slate-500 mt-0.5">🏦 {d.referral.companyName} · {d.referral.reviewedBy}</p>)}
                  {d.attachment&&<p className="text-xs text-green-400 mt-1">📎 {d.attachment.name}</p>}
                  <p className="text-xs text-slate-500 mt-1">{new Date(d.sentAt).toLocaleString()}</p>
                </div>
                <span className="status-pill pill-green">Sent</span>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

const DoctorAppointments=()=>{
  const {user}=useAuth();
  const [appts,setAppts]=useState([]);const [ok,setOk]=useState(null);
  const refresh=()=>setAppts(Object.values(D.appointments).flat().filter(a=>a.doctorId===user.id));

    }
    logAudit(user,'Appointment '+status,id);
    setOk('Appointment '+status+' — recorded on-chain');setTimeout(()=>setOk(null),4000);refresh();
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Manage Appointments</h2>
      <Alert type="ok" msg={ok}/>
      {appts.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No appointments.</Card>:appts.map(a=>(

              <div className="flex items-center gap-2 flex-wrap"><p className="font-semibold text-slate-200">{a.patientName}</p><TxBadge txHash={a.txHash}/></div>
              <p className="text-sm text-slate-500 mt-0.5">{new Date(a.date).toLocaleString()} · {a.reason}</p>

                <button onClick={()=>upd(a.id,a.patientId,'rejected','Rejected')} className="px-3 py-1.5 rounded-lg text-xs font-bold" style={{background:'rgba(248,113,113,.15)',color:'#f87171',border:'1px solid rgba(248,113,113,.3)'}}>Reject</button>

// PATIENT DATA
// ═══════════════════════════════════════════════════
const PatientDataManagement=()=>{
  const {user}=useAuth();
  const [patients,setPatients]=useState([]);const [sel,setSel]=useState('');const [notes,setNotes]=useState('');const [file,setFile]=useState(null);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const refresh=()=>setPatients(Object.values(D.patients).filter(p=>p.authorizedDoctors.includes(user.id)));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);if(!sel){setErr('Select a patient');return;}if(!notes&&!file){setErr('Provide notes or a file');return;}
    let entry={date:new Date().toISOString(),details:notes,addedBy:user.name};
    if(file){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});entry.attachment={name:file.name,content:b64,mimeType:file.type};}
    await api('/api/patient-data',{method:'POST',body:JSON.stringify({patientId:sel,healthInfo:entry})});

  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Patient Data Management</h2>

        <Sel value={sel} onChange={e=>setSel(e.target.value)} label="Select Patient">
          <option value="">— choose —</option>
          {patients.map(p=><option key={p.id} value={p.id}>{p.name[0].given[0]+' '+p.name[0].family+' ('+p.id+')'}</option>)}
        </Sel>
        <div><label className="block text-xs text-slate-400 mb-1">Notes</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} className="inp-dark resize-none" placeholder="Diagnosis, treatment notes…"/></div>
        <div><label className="block text-xs text-slate-400 mb-1">Attach File (optional)</label><input type="file" onChange={e=>setFile(e.target.files[0])} className="inp-dark text-slate-400"/></div>
        <button onClick={add} disabled={!sel||(!notes&&!file)} className="btn-eth"><IcoChain cls="w-4 h-4"/>Store on Blockchain</button>
      </Card>
      {patients.map(p=>(
        <Card key={p.id} cls="p-4">
          <p className="font-semibold text-slate-200">{p.name[0].given[0]+' '+p.name[0].family} <span className="text-xs text-slate-500">({p.id})</span></p>
          {p.healthInfo.length===0?<p className="text-sm text-slate-500 mt-2">No records yet.</p>:p.healthInfo.map((h,i)=>(
            <div key={i} className="mt-2 p-3 rounded-lg bg-slate-800/40 border border-slate-700/30">

              {h.details&&<p className="text-sm text-slate-300 mt-1">{h.details}</p>}

// ═══════════════════════════════════════════════════
// DATA TRANSFER (with file transfer to recipient)
// ═══════════════════════════════════════════════════
const DataTransfer=()=>{
  const {user}=useAuth();
  // Dynamic patient list — refreshes so newly authorized patients (from transfers) appear immediately
  const [patients,setPatients]=useState([]);
  useEffect(()=>{
    const refresh=()=>setPatients(Object.values(D.patients).filter(p=>p.authorizedDoctors.includes(user.id)));
    refresh();
    const iv=setInterval(refresh,1200);
    return()=>clearInterval(iv);
  },[user.id]);
  const [staffList]=useState(Object.values(D.users).filter(u=>['doctor','nurse','clinical'].includes(u.role)&&u.id!==user.id));
  const [selPat,setSelPat]=useState('');const [selStaff,setSelStaff]=useState('');const [sev,setSev]=useState('average');
  const [patientDocs,setPatientDocs]=useState([]);const [shareDocIds,setShareDocIds]=useState([]);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);

  useEffect(()=>{
    if(!selPat){setPatientDocs([]);setShareDocIds([]);return;}
    // All docs this user has access to for this patient
    const myDocs=(D.staffDocuments[user.id]||[]).filter(d=>d.patientId===selPat);
    setPatientDocs(myDocs);setShareDocIds([]);
  },[selPat]);

  const toggleDoc=id=>setShareDocIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const req=async()=>{
    setErr(null);if(!selPat||!selStaff){setErr('Select patient and staff');return;}
    const staff=D.users[selStaff];
    const selectedDocs=patientDocs.filter(d=>shareDocIds.includes(d.id));
    await api('/api/data-transfer',{method:'POST',body:JSON.stringify({patientId:selPat,fromUserId:user.id,toUserId:selStaff,toUserRole:staff.role,toUserName:staff.name,severity:sev,sharedExternalDocs:selectedDocs,fromOrganization:user.organization,fromDoctorName:user.name})});
    // Always authorize recipient (including doctor-to-doctor) so they can access patient & re-transfer
    await api('/api/authorize-doctor',{method:'POST',body:JSON.stringify({patientId:selPat,doctorId:selStaff})});
    logAudit(user,'Data Transfer','To '+staff.name+', sev:'+sev+', docs:'+selectedDocs.length);
    const fileCount=selectedDocs.filter(d=>d.attachment).length;
    setOk('Transfer recorded on Ethereum · '+selectedDocs.length+' doc(s), '+fileCount+' file(s) transferred');
    setTimeout(()=>setOk(null),6000);
    setSelPat('');setSelStaff('');setSev('average');setShareDocIds([]);setPatientDocs([]);
  };

  const myT=Object.values(D.transferRequests).flat().filter(t=>t.fromUserId===user.id||t.toUserId===user.id);

  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Data Transfer</h2>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      <Card cls="p-5 space-y-4">
        <h3 className="font-semibold text-slate-200">Transfer Patient Data</h3>
        <Sel value={selPat} onChange={e=>setSelPat(e.target.value)} label="Select Patient">
          <option value="">— choose —</option>
          {patients.map(p=><option key={p.id} value={p.id}>{p.name[0].given[0]+' '+p.name[0].family} ({p.id})</option>)}
        </Sel>
        <Sel value={selStaff} onChange={e=>setSelStaff(e.target.value)} label="Select Recipient Staff">
          <option value="">— choose —</option>
          {staffList.map(s=><option key={s.id} value={s.id}>{s.name} ({s.role}, {s.organization})</option>)}
        </Sel>
        <Sel value={sev} onChange={e=>setSev(e.target.value)} label="Severity">
          <option value="high">High</option><option value="average">Average</option><option value="low">Low</option>
        </Sel>
        {selPat&&(
          patientDocs.length>0?(
            <div className="border border-slate-700/50 rounded-lg overflow-hidden">
              <div className="px-4 py-2.5 bg-slate-800/50 border-b border-slate-700/30 flex items-center justify-between">
                <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Select Documents to Transfer</p>
                <button onClick={()=>setShareDocIds(shareDocIds.length===patientDocs.length?[]:patientDocs.map(d=>d.id))} className="text-xs text-indigo-400 hover:underline">{shareDocIds.length===patientDocs.length?'Deselect all':'Select all'}</button>
              </div>
              <div className="divide-y divide-slate-700/30">
                {patientDocs.map(d=>{
                  const chk=shareDocIds.includes(d.id);
                  return(
                    <label key={d.id} className={'flex items-start gap-3 p-3 cursor-pointer transition-colors '+(chk?'bg-indigo-900/20':'hover:bg-slate-800/30')}>
                      <input type="checkbox" checked={chk} onChange={()=>toggleDoc(d.id)} className="mt-0.5 w-4 h-4 accent-indigo-500"/>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-medium text-slate-200">📄 {d.documentName}</p>
                        <div className="flex items-center gap-2 mt-1 flex-wrap">
                          <TxBadge txHash={d.txHash}/>
                          {d.ipfsCID&&<IPFSBadge cid={d.ipfsCID}/>}
                        </div>
                        {d.attachment?(
                          <span className="text-xs text-green-400 flex items-center gap-1 mt-1"><IcoClip cls="w-3 h-3"/>📎 {d.attachment.name} (file will transfer)</span>
                        ):(
                          <span className="text-xs text-slate-500">No file attached</span>
                        )}
                        {d._transferredBy&&<p className="text-xs text-teal-400 mt-0.5">🔁 Originally transferred by {d._transferredByName}</p>}
                      </div>
                      {chk&&<span className="status-pill pill-indigo self-center">✓ Include</span>}
                    </label>
                  );
                })}
              </div>
            </div>
          ):(
            <div className="p-3 rounded-lg text-center text-slate-500 text-sm border border-slate-700/30">No documents available for this patient yet.</div>
          )
        )}
        <button onClick={req} disabled={!selPat||!selStaff} className="btn-eth w-full justify-center">
          <IcoChain cls="w-4 h-4"/>Record Transfer on Blockchain{shareDocIds.length>0&&' ('+shareDocIds.length+' doc'+( shareDocIds.length>1?'s':'')+')'}
        </button>
      </Card>
      <h3 className="font-semibold text-slate-300">Transfer History</h3>
      {myT.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No transfers.</Card>:myT.map(t=>(
        <Card key={t.id} cls="p-4">
          <div className="flex items-start justify-between gap-2">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-medium text-slate-200">{D.patients[t.patientId]?.name[0].given[0]+' '+D.patients[t.patientId]?.name[0].family}</p>
                <TxBadge txHash={t.txHash}/>
              </div>
              <p className="text-sm text-slate-500 mt-0.5">{D.users[t.fromUserId]?.name} → {t.toUserName} · Severity: {t.severity}</p>
              {t.sharedExternalDocs?.length>0&&(
                <div className="mt-2 space-y-1.5">
                  <p className="text-xs text-emerald-400">📦 {t.sharedExternalDocs.length} doc(s) · {t.sharedExternalDocs.filter(d=>d.attachment).length} file(s) transferred</p>
                  {/* Show download buttons for each transferred file */}
                  {t.sharedExternalDocs.filter(d=>d.attachment).map(d=>(
                    <div key={d.id} className="flex items-center justify-between p-2 rounded-lg" style={{background:'rgba(74,222,128,0.06)',border:'1px solid rgba(74,222,128,0.2)'}}>
                      <div className="flex items-center gap-2 min-w-0">
                        <IcoClip cls="w-3.5 h-3.5 text-green-400 flex-shrink-0"/>
                        <div className="min-w-0">
                          <p className="text-xs text-green-300 font-medium truncate">📄 {d.documentName}</p>
                          <p className="text-xs text-slate-500 truncate">📎 {d.attachment.name}</p>
                          {d.ipfsCID&&<IPFSBadge cid={d.ipfsCID}/>}
                        </div>
                      </div>
                      <DownloadBtn attachment={d.attachment} label="Download"/>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <span className="status-pill pill-indigo">{t.status}</span>
          </div>
        </Card>
      ))}
    </div>
  );
};

// PATIENT AUTHORIZATION
// ═══════════════════════════════════════════════════
const PatientAuthorization=()=>{
  const {user}=useAuth();
  const [reqs,setReqs]=useState([]);const [ok,setOk]=useState(null);
  const refresh=()=>setReqs((D.transferRequests[user.patientId]||[]).filter(t=>t.toUserRole==='doctor'&&t.status==='pending'));
  useEffect(()=>refresh(),[]);
  const auth=async(tid,did)=>{
    await api('/api/authorize-doctor',{method:'POST',body:JSON.stringify({patientId:user.patientId,doctorId:did})});
    const t=(D.transferRequests[user.patientId]||[]).find(x=>x.id===tid);if(t)t.status='approved';
    logAudit(user,'Authorize Doctor',did);setOk('Doctor authorized on-chain');setTimeout(()=>setOk(null),4000);refresh();
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Authorize Doctor Access</h2>
      <Alert type="ok" msg={ok}/>
      {reqs.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No pending requests.</Card>:reqs.map(t=>(
        <Card key={t.id} cls="p-4 flex items-center justify-between gap-3">
          <div><p className="font-medium text-slate-200">{t.toUserName}</p><p className="text-sm text-slate-500">Requested by {D.users[t.fromUserId]?.name} · Severity: {t.severity}</p></div>
          <button onClick={()=>auth(t.id,t.toUserId)} className="btn-eth text-xs py-1.5 px-3"><IcoChain cls="w-3.5 h-3.5"/>Authorize ⛓</button>
        </Card>
      ))}
    </div>
  );
};

// DOCTOR MANAGEMENT (Receptionist)
// ═══════════════════════════════════════════════════
const DoctorManagement=()=>{
  const {user}=useAuth();
  const [doctors,setDoctors]=useState([]);const [show,setShow]=useState(false);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [form,setForm]=useState({username:'',password:'',name:'',specialization:'General Medicine',organization:user.organization||'',portal:user.portal||'hospital',role:'doctor'});
  const refresh=()=>setDoctors(Object.values(D.users).filter(u=>u.role==='doctor'&&u.organization===user.organization));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);if(D.users[form.username]){setErr('Username exists');return;}
    const e=validatePw(form.password);if(e.length){setErr(e.join(', '));return;}
    await api('/api/users',{method:'POST',body:JSON.stringify(form)});
    logAudit(user,'Add Doctor',form.name);setOk(form.name+' registered on-chain');setTimeout(()=>setOk(null),4000);
    setShow(false);setForm({username:'',password:'',name:'',specialization:'General Medicine',organization:user.organization||'',portal:user.portal||'hospital',role:'doctor'});refresh();
  };
  return(
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-xl font-bold text-white">Doctor Management</h2>
        <button onClick={()=>setShow(true)} className="btn-eth text-xs py-1.5 px-3"><IcoPlus cls="w-4 h-4"/>Add Doctor</button>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {show&&(
        <Card cls="p-5 space-y-3">
          <h3 className="font-semibold text-slate-200">New Doctor</h3>
          <div className="grid grid-cols-2 gap-3">
            <Inp type="text" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="Username" label="Username"/>
            <Inp type="text" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Full Name" label="Full Name"/>
            <div className="col-span-2"><Inp type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Password" label="Password"/></div>
            <div className="col-span-2"><label className="block text-xs text-slate-400 mb-1">Specialization</label><select className="inp-dark" value={form.specialization} onChange={e=>setForm({...form,specialization:e.target.value})}>{organSystems.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
          </div>
          <div className="flex gap-2">
            <button onClick={add} disabled={!form.username||!form.name||!form.password} className="btn-eth"><IcoChain cls="w-4 h-4"/>Register on Chain</button>
            <button onClick={()=>{setShow(false);setErr(null);}} className="btn-ghost">Cancel</button>
          </div>
        </Card>
      )}
      <div className="space-y-3">{doctors.map(d=>(
        <Card key={d.id} cls="p-4 flex items-center justify-between">
          <div><div className="flex items-center gap-2"><p className="font-semibold text-slate-200">{d.name}</p><TxBadge txHash={d.txHash}/></div><p className="text-sm text-indigo-400">{d.specialization}</p><p className="text-xs text-slate-500">{d.username}</p></div>
          <span className="status-pill pill-green">Active</span>
        </Card>
      ))}</div>
    </div>
  );
};

// PATIENT MANAGEMENT (Receptionist)
// ═══════════════════════════════════════════════════
const PatientManagement=()=>{
  const {user}=useAuth();
  const [patients,setPatients]=useState([]);const [show,setShow]=useState(false);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [form,setForm]=useState({username:'',password:'',firstName:'',lastName:'',gender:'male',birthDate:'',email:'',phone:''});
  const refresh=()=>setPatients(Object.values(D.users).filter(u=>u.role==='patient'));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);if(D.users[form.username]){setErr('Username exists');return;}
    const e=validatePw(form.password);if(e.length){setErr(e.join(', '));return;}
    if(!form.firstName||!form.lastName||!form.birthDate||!form.email||!form.phone){setErr('All fields required');return;}
    const cnt=Object.keys(D.patients).length+1;const pid='patient-demo-'+String(cnt).padStart(3,'0');
    const ud={id:form.username,username:form.username,password:form.password,role:'patient',name:form.firstName+' '+form.lastName,portal:'patient',patientId:pid};
    D.users[form.username]=ud;
    D.patients[pid]={id:pid,name:[{family:form.lastName,given:[form.firstName]}],gender:form.gender,birthDate:form.birthDate,telecom:[{system:'email',value:form.email},{system:'phone',value:form.phone}],healthInfo:[],authorizedDoctors:[]};
    D.appointments[pid]=[];D.transferRequests[pid]=[];D.externalDocuments[pid]=[];
    if(_bcTx)D.users[form.username].txHash=(await _bcTx('registerUser',{userId:form.username,role:'patient',name:ud.name},120000,'Register Patient')).txHash;
    logAudit(user,'Add Patient',ud.name+' ('+pid+')');setOk('Patient registered on Ethereum. ID: '+pid);setTimeout(()=>setOk(null),5000);
    setShow(false);setForm({username:'',password:'',firstName:'',lastName:'',gender:'male',birthDate:'',email:'',phone:''});refresh();
  };
  return(
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-xl font-bold text-white">Patient Management</h2>
        <button onClick={()=>setShow(true)} className="btn-eth text-xs py-1.5 px-3"><IcoPlus cls="w-4 h-4"/>Add Patient</button>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {show&&(
        <Card cls="p-5 space-y-3">
          <h3 className="font-semibold text-slate-200">New Patient</h3>
          <div className="grid grid-cols-2 gap-3">
            <Inp type="text" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="Username" label="Username"/>
            <Inp type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Password" label="Password"/>
            <Inp type="text" value={form.firstName} onChange={e=>setForm({...form,firstName:e.target.value})} placeholder="First Name" label="First Name"/>
            <Inp type="text" value={form.lastName} onChange={e=>setForm({...form,lastName:e.target.value})} placeholder="Last Name" label="Last Name"/>
            <div><label className="block text-xs text-slate-400 mb-1">Gender</label><select className="inp-dark" value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
            <Inp type="date" value={form.birthDate} onChange={e=>setForm({...form,birthDate:e.target.value})} label="Birth Date"/>
            <Inp type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="Email" label="Email"/>
            <Inp type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone" label="Phone"/>
          </div>
          <div className="flex gap-2">
            <button onClick={add} disabled={!form.username||!form.password||!form.firstName||!form.lastName||!form.birthDate||!form.email||!form.phone} className="btn-eth"><IcoChain cls="w-4 h-4"/>Register on Chain</button>
            <button onClick={()=>{setShow(false);setErr(null);}} className="btn-ghost">Cancel</button>
          </div>
        </Card>
      )}
      <div className="space-y-3">{patients.map(p=>(
        <Card key={p.id} cls="p-4 flex items-center justify-between">
          <div><div className="flex items-center gap-2"><p className="font-semibold text-slate-200">{p.name}</p><TxBadge txHash={D.users[p.id]?.txHash}/></div><p className="text-xs text-slate-500">{p.username} · {p.patientId}</p></div>
          <span className="status-pill pill-indigo">Active</span>
        </Card>
      ))}</div>
    </div>
  );
};
