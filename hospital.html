const {useState,useEffect,useRef,createContext,useContext,useCallback}=React;

// ═══════════════════════════════════════════════════════════════════
// BLOCKCHAIN LAYER
// ═══════════════════════════════════════════════════════════════════
const mkHash=()=>'0x'+Array.from({length:64},()=>Math.floor(Math.random()*16).toString(16)).join('');
const mkAddr=()=>'0x'+Array.from({length:40},()=>Math.floor(Math.random()*16).toString(16)).join('');
const short=h=>h?h.slice(0,6)+'…'+h.slice(-4):'';
const gweiCost=(gwei,gas)=>((gwei*gas)/1e9).toFixed(6);

// ─── Solidity Contract Source ──────────────────────────────────────
const SOLIDITY_SOURCE=`// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;

contract HealthcareSystem {
    enum Role { None, Doctor, Patient, Clinical, Receptionist, Nurse }
    enum AppStatus { Pending, Approved, Rejected }
    enum Severity { Low, Average, High }

    struct UserRecord {
        string  username;
        bytes32 passwordHash;
        Role    role;
        string  name;
        string  organization;
        string  specialization;
        string  patientId;
        bool    exists;
    }
    struct Appointment {
        string    patientId;
        string    doctorId;
        uint256   dateTs;
        string    reason;
        string    patientName;
        AppStatus status;
        string    notes;
        bool      exists;
    }
    struct HealthEntry {
        string  details;
        string  addedBy;
        uint256 timestamp;
        string  attachmentHash; // IPFS CID
    }
    struct DataTransfer {
        string   patientId;
        string   fromUserId;
        string   toUserId;
        string   toUserName;
        Severity severity;
        uint256  timestamp;
        string[] docIds;
    }
    struct ExternalDocument {
        string  patientId; string doctorId;
        string  documentName;
        string  referralType; string referralName; string referralStaff;
        string  note; string attachmentHash;
        uint256 sentAt; bool exists;
    }

    mapping(string  => UserRecord)        public users;
    mapping(string  => string[])          public authorizedDoctors;
    mapping(bytes32 => Appointment)       public appointments;
    mapping(string  => HealthEntry[])     public healthInfos;
    mapping(bytes32 => DataTransfer)      public transfers;
    mapping(bytes32 => ExternalDocument)  public documents;
    mapping(string  => bytes32[])         public patientAppts;
    mapping(string  => bytes32[])         public doctorAppts;
    mapping(string  => bytes32[])         public patientDocs;
    mapping(string  => bytes32[])         public doctorDocs;
    string[] public allUserIds;

    event UserRegistered(string indexed userId, Role role, string name, uint256 ts);
    event AppointmentBooked(bytes32 indexed id, string patientId, string doctorId, uint256 ts);
    event AppointmentUpdated(bytes32 indexed id, AppStatus status, uint256 ts);
    event HealthInfoAdded(string indexed patientId, string addedBy, uint256 ts);
    event DoctorAuthorized(string indexed patientId, string doctorId, uint256 ts);
    event DocumentSent(bytes32 indexed id, string patientId, string doctorId, string name, uint256 ts);
    event DataTransferred(bytes32 indexed id, string from, string to, string patient, uint256 ts);
    event AuditLog(address indexed caller, string userId, string action, string details, uint256 ts);

    function registerUser(string memory id,string memory username,
        bytes32 pwHash,uint8 role,string memory name,
        string memory org,string memory spec,string memory patientId) external {
        require(!users[id].exists,"exists");
        users[id]=UserRecord(username,pwHash,Role(role),name,org,spec,patientId,true);
        allUserIds.push(id);
        emit UserRegistered(id,Role(role),name,block.timestamp);
    }

    function bookAppointment(string memory apptId,string memory patientId,
        string memory doctorId,uint256 dateTs,
        string memory reason,string memory patientName) external {
        bytes32 k=keccak256(bytes(apptId));
        appointments[k]=Appointment(patientId,doctorId,dateTs,reason,patientName,AppStatus.Pending,"",true);
        patientAppts[patientId].push(k);
        doctorAppts[doctorId].push(k);
        emit AppointmentBooked(k,patientId,doctorId,block.timestamp);
    }

    function updateAppointment(string memory apptId,uint8 status,string memory notes) external {
        bytes32 k=keccak256(bytes(apptId));
        require(appointments[k].exists,"!found");
        appointments[k].status=AppStatus(status);
        if(bytes(notes).length>0) appointments[k].notes=notes;
        emit AppointmentUpdated(k,AppStatus(status),block.timestamp);
    }

    function addHealthInfo(string memory patientId,string memory details,
        string memory addedBy,string memory attachHash) external {
        healthInfos[patientId].push(HealthEntry(details,addedBy,block.timestamp,attachHash));
        emit HealthInfoAdded(patientId,addedBy,block.timestamp);
    }

    function authorizeDoctor(string memory patientId,string memory doctorId) external {
        string[] storage arr=authorizedDoctors[patientId];
        for(uint i=0;i<arr.length;i++)
            if(keccak256(bytes(arr[i]))==keccak256(bytes(doctorId)))return;
        arr.push(doctorId);
        emit DoctorAuthorized(patientId,doctorId,block.timestamp);
    }

    function sendDocument(string memory docId,string memory patientId,
        string memory doctorId,string memory docName,string memory refType,
        string memory refName,string memory refStaff,string memory note,
        string memory attachHash) external {
        bytes32 k=keccak256(bytes(docId));
        documents[k]=ExternalDocument(patientId,doctorId,docName,refType,refName,
            refStaff,note,attachHash,block.timestamp,true);
        patientDocs[patientId].push(k); doctorDocs[doctorId].push(k);
        emit DocumentSent(k,patientId,doctorId,docName,block.timestamp);
    }

    function requestTransfer(string memory tId,string memory patientId,
        string memory fromId,string memory toId,string memory toName,
        uint8 severity,string[] memory docIds) external {
        bytes32 k=keccak256(bytes(tId));
        transfers[k]=DataTransfer(patientId,fromId,toId,toName,Severity(severity),block.timestamp,docIds);
        emit DataTransferred(k,fromId,toId,patientId,block.timestamp);
    }

    function emitAudit(string memory userId,string memory action,string memory details) external {
        emit AuditLog(msg.sender,userId,action,details,block.timestamp);
    }
}`;

// ─── SimChain: Ethereum Blockchain Simulator ───────────────────────
class SimChain{
  constructor(){
    this.block=7243891+Math.floor(Math.random()*50000);
    this.txs=[];
    this._subs={};
    this.gasPrice=12; // gwei
    this.walletAddr=mkAddr();
    this.networkName='Sepolia Testnet';
    this.chainId=11155111;
  }
  async tx(method,args={},gasEst=90000,label='Transaction'){
    await new Promise(r=>setTimeout(r,700+Math.random()*700));
    this.block++;
    const gas=Math.floor(gasEst*(0.78+Math.random()*0.44));
    const r={
      txHash:mkHash(),blockHash:mkHash(),
      blockNumber:this.block,gasUsed:gas,
      gasPrice:this.gasPrice,
      ethCost:gweiCost(this.gasPrice,gas),
      status:1,method,label,args,
      from:this.walletAddr,
      contractAddr:'0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0',
      ts:Date.now()
    };
    this.txs.unshift(r);
    (this._subs['*']||[]).forEach(fn=>fn(r));
    return r;
  }
  on(ev,fn){if(!this._subs[ev])this._subs[ev]=[];this._subs[ev].push(fn);}
  off(ev,fn){if(this._subs[ev])this._subs[ev]=this._subs[ev].filter(x=>x!==fn);}
  getTxs(){return[...this.txs];}
  getBlock(){return this.block;}
  getAddr(){return this.walletAddr;}
}
const SC=new SimChain();

// Try real MetaMask
let _mmWallet=null;
const tryMetaMask=async(setWallet)=>{
  if(!window.ethereum)return false;
  try{
    const p=new ethers.providers.Web3Provider(window.ethereum);
    await p.send('eth_requestAccounts',[]);
    const s=p.getSigner();
    const addr=await s.getAddress();
    const bal=await p.getBalance(addr);
    const net=await p.getNetwork();
    _mmWallet={address:addr,balance:parseFloat(ethers.utils.formatEther(bal)).toFixed(4),chainId:net.chainId,name:net.name,real:true};
    setWallet(_mmWallet);
    return true;
  }catch(e){return false;}
};

// BLOCKCHAIN CONTEXT
// ═══════════════════════════════════════════════════════════════════
const BCCtx=createContext(null);
const BCProvider=({children})=>{
  const [wallet,setWallet]=useState({address:SC.getAddr(),balance:'2.4581',chainId:11155111,name:'Sepolia Testnet',simulated:true});
  const [connecting,setConn]=useState(false);
  const [toasts,setToasts]=useState([]);
  const [pending,setPending]=useState({}); // id->bool

  const addToast=useCallback((r,label)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,r,label}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),6000);
  },[]);

  const connect=async()=>{
    setConn(true);
    const ok=await tryMetaMask(setWallet);
    if(!ok) setWallet(w=>({...w,simulated:true}));
    setConn(false);
  };

  const bcTx=useCallback(async(method,args,gasEst,label)=>{
    const key=method+JSON.stringify(args);
    setPending(p=>({...p,[key]:true}));
    const r=await SC.tx(method,args,gasEst,label);
    setPending(p=>({...p,[key]:false}));
    addToast(r,label);
    return r;
  },[addToast]);

  return <BCCtx.Provider value={{wallet,connecting,connect,toasts,pending,bcTx}}>{children}</BCCtx.Provider>;
};
const useBC=()=>useContext(BCCtx);

// ═══════════════════════════════════════════════════════════════════
// DATA STORE (cache layer on top of blockchain)
// ═══════════════════════════════════════════════════════════════════
const organSystems=['Cardiovascular System','Respiratory System','Nervous System','Digestive System','Musculoskeletal System','Endocrine System','Urinary System','Reproductive System','Immune System','Integumentary System','General Medicine'];
const validatePw=p=>{const e=[];if(p.length<8)e.push('Min 8 chars');if(!/[A-Z]/.test(p))e.push('Uppercase needed');if(!/[a-z]/.test(p))e.push('Lowercase needed');if(!/[0-9]/.test(p))e.push('Number needed');return e;};

const D={
  users:{
    'doctor001':{id:'doctor001',username:'doctor001',password:'password123',role:'doctor',name:'Dr. Alice Smith',organization:'SAAS Hospital',portal:'hospital',specialization:'Cardiovascular System',txHash:mkHash()},
    'patient001':{id:'patient001',username:'patient001',password:'patient123',role:'patient',name:'John Doe',patientId:'patient-demo-001',portal:'patient',txHash:mkHash()},
    'clinical001':{id:'clinical001',username:'clinical001',password:'clinical123',role:'clinical',name:'Dr. Sarah Wilson',organization:'City Medical Clinic',portal:'clinic',specialization:'Respiratory System',txHash:mkHash()},
    'receptionist001':{id:'receptionist001',username:'receptionist001',password:'reception123',role:'receptionist',name:'Emma Thompson',organization:'SAAS Hospital',portal:'hospital',txHash:mkHash()},
    'nurse001':{id:'nurse001',username:'nurse001',password:'nurse123',role:'nurse',name:'Nurse Mary Johnson',organization:'SAAS Hospital',portal:'hospital',txHash:mkHash()}
  },
  patients:{
    'patient-demo-001':{id:'patient-demo-001',name:[{family:'Doe',given:['John']}],gender:'male',birthDate:'1980-01-15',telecom:[{system:'email',value:'john.doe@email.com'},{system:'phone',value:'555-0123'}],healthInfo:[],authorizedDoctors:['doctor001']}
  },
  appointments:{'patient-demo-001':[]},
  transferRequests:{'patient-demo-001':[]},
  externalDocuments:{'patient-demo-001':[]},
  auditLogs:[],
  notifications:{}
};

let _bcTx=null; // injected

const logAudit=(u,a,d)=>{
  const entry={userId:u.id,userName:u.name,role:u.role,action:a,details:d,timestamp:new Date().toISOString()};
  D.auditLogs.push(entry);
  if(_bcTx) _bcTx('emitAudit',{userId:u.id,action:a,details:d},45000,'Audit: '+a);
};
const addNotif=(uid,msg)=>{if(!D.notifications[uid])D.notifications[uid]=[];D.notifications[uid].push({id:'n'+Date.now()+Math.random(),message:msg,timestamp:new Date().toISOString(),read:false});};

const api=async(ep,opts={})=>{
  await new Promise(r=>setTimeout(r,80));
  const method=opts.method||'GET';
  const body=opts.body?JSON.parse(opts.body):null;

  if(ep.includes('/appointments')&&method==='POST'){
    const a={id:'appt'+Date.now(),...body,status:'pending'};
    if(!D.appointments[body.patientId])D.appointments[body.patientId]=[];
    D.appointments[body.patientId].push(a);
    if(_bcTx)a.txHash=(await _bcTx('bookAppointment',{apptId:a.id,patientId:body.patientId,doctorId:body.doctorId},95000,'Book Appointment')).txHash;
    return a;
  }
  if(ep.includes('/appointments')&&method==='PUT'){
    const arr=D.appointments[body.patientId]||[];
    const a=arr.find(x=>x.id===body.id);
    if(a){a.status=body.status;if(body.notes)a.notes=body.notes;if(_bcTx)a.statusTxHash=(await _bcTx('updateAppointment',{apptId:body.id,status:body.status},65000,'Update Appointment')).txHash;}
    return a;
  }
  if(ep.includes('/patient-data')&&method==='POST'){
    D.patients[body.patientId].healthInfo.push(body.healthInfo);
    if(_bcTx)body.healthInfo.txHash=(await _bcTx('addHealthInfo',{patientId:body.patientId,addedBy:body.healthInfo.addedBy},110000,'Add Health Info')).txHash;
    return{success:true};
  }
  if(ep.includes('/data-transfer')&&method==='POST'){
    const t={id:'tr'+Date.now(),...body,status:'pending'};
    if(!D.transferRequests[body.patientId])D.transferRequests[body.patientId]=[];
    D.transferRequests[body.patientId].push(t);
    addNotif(body.toUserId,'Data transfer from '+D.users[body.fromUserId].name+' (sev: '+body.severity+')');
    if(_bcTx)t.txHash=(await _bcTx('requestTransfer',{transferId:t.id,from:body.fromUserId,to:body.toUserId,severity:body.severity},130000,'Data Transfer')).txHash;
    return t;
  }
  if(ep.includes('/authorize-doctor')&&method==='POST'){
    const{patientId,doctorId}=body;
    if(!D.patients[patientId].authorizedDoctors.includes(doctorId))D.patients[patientId].authorizedDoctors.push(doctorId);
    addNotif(doctorId,'Patient '+patientId+' authorized your access.');
    if(_bcTx)await _bcTx('authorizeDoctor',{patientId,doctorId},60000,'Authorize Doctor');
    return{success:true};
  }
  if(ep.includes('/external-document')&&method==='POST'){
    if(!D.externalDocuments[body.patientId])D.externalDocuments[body.patientId]=[];
    const doc={id:'doc'+Date.now(),...body,sentAt:new Date().toISOString()};
    D.externalDocuments[body.patientId].push(doc);
    addNotif(body.doctorId,'Patient '+body.patientName+' sent a document: "'+body.documentName+'"');
    if(_bcTx)doc.txHash=(await _bcTx('sendDocument',{docId:doc.id,patientId:body.patientId,doctorId:body.doctorId,docName:body.documentName},150000,'Send Document')).txHash;
    return doc;
  }
  if(ep.includes('/users')&&method==='POST'){
    D.users[body.username]={id:body.username,...body};
    if(_bcTx)D.users[body.username].txHash=(await _bcTx('registerUser',{userId:body.username,role:body.role,name:body.name},120000,'Register User')).txHash;
    return D.users[body.username];
  }
  if(ep.includes('/users')&&method==='PUT'){
    D.users[body.id]={...D.users[body.id],...body};
    if(_bcTx)await _bcTx('updateProfile',{userId:body.id},55000,'Update Profile');
    return D.users[body.id];
  }
  return{};
};

const AuthCtx=createContext(null);
const AuthProvider=({children})=>{
  const [user,setUser]=useState(null);
  useEffect(()=>{try{const u=JSON.parse(sessionStorage.getItem('u')||'null');if(u)setUser(u);}catch(e){}},[]);
  const login=async(un,pw)=>{
    await new Promise(r=>setTimeout(r,300));
    const u=D.users[un];
    if(!u||u.password!==pw)return{success:false,error:'Invalid credentials'};
    const ud={id:u.id,username:u.username,role:u.role,name:u.name,organization:u.organization,portal:u.portal,patientId:u.patientId,specialization:u.specialization};
    setUser(ud);sessionStorage.setItem('u',JSON.stringify(ud));
    logAudit(ud,'Login',ud.name+' logged in');
    return{success:true};
  };
  const logout=()=>{if(user)logAudit(user,'Logout',user.name+' logged out');setUser(null);sessionStorage.removeItem('u');};
  const updateUser=nu=>{const u={...user,username:nu};setUser(u);sessionStorage.setItem('u',JSON.stringify(u));};
  return <AuthCtx.Provider value={{user,login,logout,updateUser}}>{children}</AuthCtx.Provider>;
};
const useAuth=()=>useContext(AuthCtx);

const ProfileManagement=()=>{
  const {user,updateUser}=useAuth();
  const {bcTx}=useBC();
  const [un,setUn]=useState(user.username);
  const [pw,setPw]=useState('');const [cpw,setCpw]=useState('');
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const save=async()=>{
    setErr(null);setOk(null);
    if(!un){setErr('Username required');return;}
    if(pw&&pw!==cpw){setErr('Passwords do not match');return;}
    if(pw){const e=validatePw(pw);if(e.length){setErr(e.join(', '));return;}}
    await api('/api/users',{method:'PUT',body:JSON.stringify({id:user.id,username:un,...(pw?{password:pw}:{})})});
    updateUser(un);logAudit(user,'Profile Update','Updated profile');
    setOk('Profile updated & recorded on-chain');setTimeout(()=>setOk(null),4000);
    setPw('');setCpw('');
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Profile Management</h2>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      <Card cls="p-5 space-y-3">
        <div className="flex items-center gap-2 mb-1">
          <h3 className="font-semibold text-slate-200">Update Profile</h3>
          <TxBadge txHash={D.users[user.id]?.txHash}/>
        </div>
        <Inp type="text" value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" label="Username"/>
        <Inp type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Leave blank to keep current" label="New Password"/>
        <Inp type="password" value={cpw} onChange={e=>setCpw(e.target.value)} placeholder="Confirm new password" label="Confirm Password"/>
        <button onClick={save} disabled={!un} className="btn-eth">Save & Record on Chain</button>
      </Card>
    </div>
  );
};

// DOCTOR APPOINTMENTS
// ═══════════════════════════════════════════════════════════════════
const DoctorAppointments=()=>{
  const {user}=useAuth();
  const [appts,setAppts]=useState([]);
  const [ok,setOk]=useState(null);
  const refresh=()=>setAppts(Object.values(D.appointments).flat().filter(a=>a.doctorId===user.id));
  useEffect(()=>refresh(),[]);
  const upd=async(id,pid,status,notes)=>{
    await api('/api/appointments',{method:'PUT',body:JSON.stringify({id,patientId:pid,status,notes:notes||''})});
    if(status==='approved'){
      await api('/api/authorize-doctor',{method:'POST',body:JSON.stringify({patientId:pid,doctorId:user.id})});
      const pu=Object.values(D.users).find(u=>u.patientId===pid);
      if(pu)addNotif(pu.id,'✅ Dr. '+user.name+' approved your appointment.');
    }
    logAudit(user,'Appointment '+status,id);
    setOk('Appointment '+status+' — recorded on-chain');setTimeout(()=>setOk(null),4000);refresh();
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Manage Appointments</h2>
      <Alert type="ok" msg={ok}/>
      {appts.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No appointments.</Card>:appts.map(a=>(
        <Card key={a.id} cls="p-4">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-semibold text-slate-200">{a.patientName}</p>
                <TxBadge txHash={a.txHash}/>
              </div>
              <p className="text-sm text-slate-500 mt-0.5">{new Date(a.date).toLocaleString()} · {a.reason}</p>
              <span className={'status-pill mt-1 inline-block '+(a.status==='approved'?'pill-green':a.status==='rejected'?'pill-red':'pill-yellow')}>{a.status}</span>
            </div>
            {a.status==='pending'&&(
              <div className="flex gap-2 flex-shrink-0">
                <button onClick={()=>upd(a.id,a.patientId,'approved')} className="px-3 py-1.5 rounded-lg text-xs font-bold" style={{background:'rgba(74,222,128,.15)',color:'#4ade80',border:'1px solid rgba(74,222,128,.3)'}}>Approve ⛓</button>
                <button onClick={()=>upd(a.id,a.patientId,'rejected','Rejected')} className="px-3 py-1.5 rounded-lg text-xs font-bold" style={{background:'rgba(248,113,113,.15)',color:'#f87171',border:'1px solid rgba(248,113,113,.3)'}}>Reject</button>
              </div>
            )}
            {a.statusTxHash&&<TxBadge txHash={a.statusTxHash}/>}
          </div>
        </Card>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// PATIENT DATA
// ═══════════════════════════════════════════════════════════════════
const PatientDataManagement=()=>{
  const {user}=useAuth();
  const [patients,setPatients]=useState([]);
  const [sel,setSel]=useState('');const [notes,setNotes]=useState('');const [file,setFile]=useState(null);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const refresh=()=>setPatients(Object.values(D.patients).filter(p=>p.authorizedDoctors.includes(user.id)));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);
    if(!sel){setErr('Select a patient');return;}
    if(!notes&&!file){setErr('Provide notes or a file');return;}
    let entry={date:new Date().toISOString(),details:notes,addedBy:user.name};
    if(file){
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
      entry.attachment={name:file.name,content:b64,mimeType:file.type};
    }
    await api('/api/patient-data',{method:'POST',body:JSON.stringify({patientId:sel,healthInfo:entry})});
    logAudit(user,'Add Health Info','For '+sel);
    setOk('Health info added & hash stored on Ethereum');setTimeout(()=>setOk(null),4000);
    setSel('');setNotes('');setFile(null);refresh();
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Patient Data Management</h2>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      <Card cls="p-5 space-y-3">
        <h3 className="font-semibold text-slate-200">Add Health Information</h3>
        <Sel value={sel} onChange={e=>setSel(e.target.value)} label="Select Patient">
          <option value="">— choose —</option>
          {patients.map(p=><option key={p.id} value={p.id}>{p.name[0].given[0]+' '+p.name[0].family+' ('+p.id+')'}</option>)}
        </Sel>
        <div><label className="block text-xs text-slate-400 mb-1">Notes</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} className="inp-dark resize-none" placeholder="Diagnosis, treatment notes…"/></div>
        <div><label className="block text-xs text-slate-400 mb-1">Attach File (optional)</label><input type="file" onChange={e=>setFile(e.target.files[0])} className="inp-dark text-slate-400"/></div>
        <button onClick={add} disabled={!sel||(!notes&&!file)} className="btn-eth"><IcoChain cls="w-4 h-4"/>Store on Blockchain</button>
      </Card>
      <h3 className="font-semibold text-slate-300">Patient Records</h3>
      {patients.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No authorized patients.</Card>:patients.map(p=>(
        <Card key={p.id} cls="p-4">
          <p className="font-semibold text-slate-200">{p.name[0].given[0]+' '+p.name[0].family} <span className="text-xs text-slate-500">('+p.id+')</span></p>
          {p.healthInfo.length===0?<p className="text-sm text-slate-500 mt-2">No records yet.</p>:p.healthInfo.map((h,i)=>(
            <div key={i} className="mt-2 p-3 rounded-lg bg-slate-800/40 border border-slate-700/30">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="text-xs text-slate-500">{new Date(h.date).toLocaleString()+' · '+h.addedBy}</p>
                <TxBadge txHash={h.txHash}/>
              </div>
              {h.details&&<p className="text-sm text-slate-300 mt-1">{h.details}</p>}
              {h.attachment&&<a href={'data:'+h.attachment.mimeType+';base64,'+h.attachment.content} download={h.attachment.name} className="text-sm text-indigo-400 underline mt-1 block">📎 {h.attachment.name}</a>}
            </div>
          ))}
        </Card>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// DATA TRANSFER
// ═══════════════════════════════════════════════════════════════════
const DataTransfer=()=>{
  const {user}=useAuth();
  const [patients]=useState(Object.values(D.patients).filter(p=>p.authorizedDoctors.includes(user.id)));
  const [staffList]=useState(Object.values(D.users).filter(u=>['doctor','nurse','clinical'].includes(u.role)&&u.id!==user.id));
  const [selPat,setSelPat]=useState('');const [selStaff,setSelStaff]=useState('');const [sev,setSev]=useState('average');
  const [patientDocs,setPatientDocs]=useState([]);const [shareDocIds,setShareDocIds]=useState([]);
  const [dismissed,setDismissed]=useState({});
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);

  useEffect(()=>{
    if(!selPat){setPatientDocs([]);setShareDocIds([]);return;}
    const direct=(D.externalDocuments[selPat]||[]).filter(d=>d.doctorId===user.id);
    const forwarded=Object.values(D.transferRequests).flat().filter(t=>t.toUserId===user.id&&t.patientId===selPat&&t.sharedExternalDocs?.length>0).flatMap(t=>t.sharedExternalDocs.map(sd=>({...sd,_forwarded:true,_fromName:D.users[t.fromUserId]?.name})));
    const seen=new Set();const all=[...direct,...forwarded].filter(d=>{if(seen.has(d.id))return false;seen.add(d.id);return true;});
    setPatientDocs(all);setShareDocIds([]);
  },[selPat]);

  const toggleDoc=id=>setShareDocIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const req=async()=>{
    setErr(null);
    if(!selPat||!selStaff){setErr('Select patient and staff');return;}
    const staff=D.users[selStaff];const pat=D.patients[selPat];
    const patName=pat.name[0].given[0]+' '+pat.name[0].family;
    const selectedDocs=patientDocs.filter(d=>shareDocIds.includes(d.id)).map(d=>({...d,_forwardedBy:user.name,_forwardedFrom:user.organization}));
    await api('/api/data-transfer',{method:'POST',body:JSON.stringify({patientId:selPat,fromUserId:user.id,toUserId:selStaff,toUserRole:staff.role,toUserName:staff.name,severity:sev,sharedExternalDocs:selectedDocs,fromOrganization:user.organization,fromDoctorName:user.name})});
    if(staff.role!=='doctor')await api('/api/authorize-doctor',{method:'POST',body:JSON.stringify({patientId:selPat,doctorId:selStaff})});
    if(selectedDocs.length>0)addNotif(selStaff,'📎 Dr. '+user.name+' transferred data with '+selectedDocs.length+' doc(s) for '+patName+'.');
    logAudit(user,'Data Transfer','To '+staff.name+', sev:'+sev);
    setOk('Transfer recorded on Ethereum'+( selectedDocs.length>0?' — '+selectedDocs.length+' doc(s)':''));
    setTimeout(()=>setOk(null),5000);
    setSelPat('');setSelStaff('');setSev('average');setShareDocIds([]);setPatientDocs([]);
  };
  const incoming=Object.values(D.transferRequests).flat().filter(t=>t.toUserId===user.id&&t.sharedExternalDocs?.length>0&&!dismissed[t.id]);
  const myT=Object.values(D.transferRequests).flat().filter(t=>t.fromUserId===user.id||t.toUserId===user.id);
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Data Transfer</h2>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {incoming.length>0&&incoming.map(t=>{
        const sender=D.users[t.fromUserId];const pat=D.patients[t.patientId];
        return(
          <div key={t.id} className="rounded-xl overflow-hidden border border-indigo-500/40">
            <div className="px-4 py-2.5 flex items-center justify-between" style={{background:'linear-gradient(135deg,#4338ca,#6d28d9)'}}>
              <div className="flex items-center gap-2"><IcoShare cls="w-4 h-4 text-white"/><span className="text-white text-sm font-semibold">From {sender?.name}</span><TxBadge txHash={t.txHash}/></div>
              <button onClick={()=>setDismissed(p=>({...p,[t.id]:true}))} className="text-white/60 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <div className="bg-slate-900/50 p-4 space-y-2">
              <p className="text-xs text-slate-400">Patient: <b className="text-slate-200">{pat?.name[0].given[0]+' '+pat?.name[0].family}</b> · Severity: {t.severity}</p>
              {t.sharedExternalDocs.map((sd,i)=>(
                <div key={i} className="p-3 rounded-lg border border-indigo-500/20 bg-indigo-900/20 space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <p className="text-sm font-semibold text-indigo-200">📄 {sd.documentName}</p>
                    {sd.attachment?<span className="status-pill pill-green">📎 Has file</span>:<span className="status-pill pill-indigo">No file</span>}
                  </div>
                  <ReferralBadge referral={sd.referral}/>
                  {sd.attachment&&<a href={'data:'+sd.attachment.mimeType+';base64,'+sd.attachment.content} download={sd.attachment.name} className="flex items-center gap-1.5 text-xs text-green-400 bg-green-900/20 border border-green-500/30 rounded px-2 py-1 hover:bg-green-900/40 w-fit"><IcoClip cls="w-3.5 h-3.5"/>{sd.attachment.name}</a>}
                  {sd._forwardedBy&&<p className="text-xs text-indigo-400">Forwarded by {sd._forwardedBy}</p>}
                </div>
              ))}
            </div>
          </div>
        );
      })}
      <Card cls="p-5 space-y-4">
        <h3 className="font-semibold text-slate-200">Request Transfer</h3>
        <Sel value={selPat} onChange={e=>setSelPat(e.target.value)} label="Select Patient">
          <option value="">— choose —</option>
          {patients.map(p=><option key={p.id} value={p.id}>{p.name[0].given[0]+' '+p.name[0].family} ({p.id})</option>)}
        </Sel>
        <Sel value={selStaff} onChange={e=>setSelStaff(e.target.value)} label="Select Staff">
          <option value="">— choose —</option>
          {staffList.map(s=><option key={s.id} value={s.id}>{s.name} ({s.role}, {s.organization})</option>)}
        </Sel>
        <Sel value={sev} onChange={e=>setSev(e.target.value)} label="Severity">
          <option value="high">High</option><option value="average">Average</option><option value="low">Low</option>
        </Sel>
        {selPat&&patientDocs.length>0&&(
          <div className="border border-slate-700/50 rounded-lg overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-800/50 border-b border-slate-700/30 flex items-center justify-between">
              <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Include External Documents</p>
              <button onClick={()=>setShareDocIds(shareDocIds.length===patientDocs.length?[]:patientDocs.map(d=>d.id))} className="text-xs text-indigo-400 hover:underline">{shareDocIds.length===patientDocs.length?'Deselect all':'Select all'}</button>
            </div>
            <div className="divide-y divide-slate-700/30">
              {patientDocs.map(d=>{
                const chk=shareDocIds.includes(d.id);
                return(
                  <label key={d.id} className={'flex items-start gap-3 p-3 cursor-pointer transition-colors '+(chk?'bg-indigo-900/20':'hover:bg-slate-800/30')}>
                    <input type="checkbox" checked={chk} onChange={()=>toggleDoc(d.id)} className="mt-0.5 w-4 h-4 accent-indigo-500"/>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-slate-200">📄 {d.documentName}</p>
                      <TxBadge txHash={d.txHash}/>
                      {d.attachment?<span className="text-xs text-green-400">📎 Attachment included</span>:<span className="text-xs text-slate-500">No attachment</span>}
                    </div>
                    {chk&&<span className="status-pill pill-indigo self-center">✓ Include</span>}
                  </label>
                );
              })}
            </div>
          </div>
        )}
        <button onClick={req} disabled={!selPat||!selStaff} className="btn-eth w-full justify-center"><IcoChain cls="w-4 h-4"/>Record Transfer on Blockchain</button>
      </Card>
      <h3 className="font-semibold text-slate-300">Transfer History</h3>
      {myT.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No transfers.</Card>:myT.map(t=>(
        <Card key={t.id} cls="p-4">
          <div className="flex items-start justify-between gap-2">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-medium text-slate-200">{D.patients[t.patientId]?.name[0].given[0]+' '+D.patients[t.patientId]?.name[0].family}</p>
                <TxBadge txHash={t.txHash}/>
              </div>
              <p className="text-sm text-slate-500 mt-0.5">{D.users[t.fromUserId]?.name} → {t.toUserName} · Severity: {t.severity}</p>
            </div>
            <span className="status-pill pill-indigo">{t.status}</span>
          </div>
        </Card>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// SEND EXTERNAL DOCUMENT (Patient)
// ═══════════════════════════════════════════════════════════════════
const SendExternalDocument=()=>{
  const {user}=useAuth();
  const approvedAppts=(D.appointments[user.patientId]||[]).filter(a=>a.status==='approved');
  const [selAppt,setSelAppt]=useState('');const [docName,setDocName]=useState('');const [docNote,setDocNote]=useState('');
  const [refType,setRefType]=useState('hospital');const [checkedBy,setCheckedBy]=useState('');const [hospName,setHospName]=useState('');
  const [insCompany,setInsCompany]=useState('');const [insStaff,setInsStaff]=useState('');const [file,setFile]=useState(null);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [sent,setSent]=useState([...(D.externalDocuments[user.patientId]||[])]);
  const apptData=approvedAppts.find(a=>a.id===selAppt);
  const apptDoc=apptData?D.users[apptData.doctorId]:null;
  const refOk=refType==='hospital'?(hospName.trim()&&checkedBy.trim()):(insCompany.trim()&&insStaff.trim());
  const canSend=selAppt&&(docName.trim()||file)&&refOk;
  const send=async()=>{
    setErr(null);
    if(!selAppt||(!docName.trim()&&!file)||!refOk){setErr('Fill all required fields');return;}
    try{
      let att=null;
      if(file){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});att={name:file.name,content:b64,mimeType:file.type};}
      const referral=refType==='hospital'?{type:'hospital',hospitalName:hospName,checkedBy}:{type:'insurance',companyName:insCompany,reviewedBy:insStaff};
      await api('/api/external-document',{method:'POST',body:JSON.stringify({patientId:user.patientId,patientName:user.name,doctorId:apptData.doctorId,doctorName:apptDoc.name,doctorOrganization:apptDoc.organization,appointmentDate:apptData.date,appointmentReason:apptData.reason,documentName:docName||(file?.name)||'Untitled',note:docNote,referral,attachment:att})});
      logAudit(user,'Send External Document','Sent to '+apptDoc.name);
      setOk('Document sent & hash stored on Ethereum');setTimeout(()=>setOk(null),5000);
      setSelAppt('');setDocName('');setDocNote('');setRefType('hospital');setCheckedBy('');setHospName('');setInsCompany('');setInsStaff('');setFile(null);
      setSent([...(D.externalDocuments[user.patientId]||[])]);
    }catch(e){setErr('Failed: '+e.message);}
  };
  return(
    <div className="space-y-6">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#627eea,#8b5cf6)'}}><IcoSend cls="w-5 h-5 text-white"/></div>
        <div><h2 className="text-xl font-bold text-white">Send Document to Doctor</h2><p className="text-sm text-slate-400">Document hash stored immutably on Ethereum</p></div>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {approvedAppts.length===0?(
        <Card cls="p-6 text-center"><IcoDoc cls="w-10 h-10 text-slate-600 mx-auto mb-3"/><p className="font-medium text-slate-400">No approved appointments</p></Card>
      ):(
        <Card cls="p-5 space-y-4">
          <h3 className="font-semibold text-slate-200">Compose Document</h3>
          <div>
            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Select Appointed Doctor</label>
            <select value={selAppt} onChange={e=>setSelAppt(e.target.value)} className="inp-dark">
              <option value="">— choose —</option>
              {approvedAppts.map(a=>{const doc=D.users[a.doctorId];return <option key={a.id} value={a.id}>{doc?.name} · {new Date(a.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</option>;})}
            </select>
          </div>
          {apptDoc&&(
            <div className="flex items-center gap-3 p-3 rounded-lg" style={{background:'rgba(98,126,234,0.1)',border:'1px solid rgba(98,126,234,0.3)'}}>
              <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{background:'linear-gradient(135deg,#627eea,#8b5cf6)'}}><IcoUser cls="w-4 h-4 text-white"/></div>
              <div className="flex-1 min-w-0">
                <p className="font-semibold text-indigo-200 text-sm">{apptDoc.name}</p>
                <p className="text-xs text-indigo-400">🏥 {apptDoc.organization} · 🩺 {apptDoc.specialization}</p>
              </div>
              <span className="status-pill pill-green">Approved ✓</span>
            </div>
          )}
          <Inp type="text" value={docName} onChange={e=>setDocName(e.target.value)} placeholder="e.g. Blood Test Results" label="Document Title"/>
          <div className="border border-slate-700/50 rounded-lg overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-800/50 border-b border-slate-700/30">
              <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Referral Attribution *</p>
            </div>
            <div className="p-4 space-y-3">
              <div className="flex gap-2">
                {['hospital','insurance'].map(t=>(
                  <button key={t} type="button" onClick={()=>{setRefType(t);setCheckedBy('');setHospName('');setInsCompany('');setInsStaff('');}}
                    className={'flex-1 py-2 rounded-lg text-sm font-medium transition-colors '+(refType===t?'text-white'+(t==='hospital'?' bg-indigo-600':' bg-purple-600'):'text-slate-400 bg-slate-800/50 hover:bg-slate-700/50')}>
                    {t==='hospital'?'🏥 Hospital':'🏦 Insurance'}
                  </button>
                ))}
              </div>
              {refType==='hospital'?(
                <>
                  <Inp type="text" value={hospName} onChange={e=>setHospName(e.target.value)} placeholder="e.g. City General Hospital" label="Hospital / Clinic Name *"/>
                  <Inp type="text" value={checkedBy} onChange={e=>setCheckedBy(e.target.value)} placeholder="e.g. Dr. John Smith" label="Checked By *"/>
                </>
              ):(
                <>
                  <Inp type="text" value={insCompany} onChange={e=>setInsCompany(e.target.value)} placeholder="e.g. MediShield Insurance" label="Insurance Company *"/>
                  <Inp type="text" value={insStaff} onChange={e=>setInsStaff(e.target.value)} placeholder="e.g. James Carter" label="Reviewed By *"/>
                </>
              )}
            </div>
          </div>
          <div><label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Additional Notes (optional)</label><textarea value={docNote} onChange={e=>setDocNote(e.target.value)} rows={3} className="inp-dark resize-none" placeholder="Any notes for the doctor…"/></div>
          <div><label className="block text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Attach File (optional)</label><input type="file" onChange={e=>setFile(e.target.files[0])} className="inp-dark text-slate-400"/></div>
          <button onClick={send} disabled={!canSend} className="btn-eth w-full justify-center"><IcoChain cls="w-4 h-4"/>Send & Record on Ethereum</button>
        </Card>
      )}
      {sent.length>0&&(
        <div className="space-y-3">
          <h3 className="font-semibold text-slate-300">Sent Documents ({sent.length})</h3>
          {sent.map(d=>(
            <Card key={d.id} cls="p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <p className="font-medium text-slate-200 text-sm">📄 {d.documentName}</p>
                  <div className="flex items-center gap-2 mt-1 flex-wrap"><TxBadge txHash={d.txHash}/></div>
                  <p className="text-sm text-indigo-400 mt-0.5">→ {d.doctorName} · {d.doctorOrganization}</p>
                  {d.referral&&(d.referral.type==='hospital'?<p className="text-xs text-slate-500 mt-0.5">🏥 {d.referral.hospitalName} · {d.referral.checkedBy}</p>:<p className="text-xs text-slate-500 mt-0.5">🏦 {d.referral.companyName} · {d.referral.reviewedBy}</p>)}
                  <p className="text-xs text-slate-500 mt-1">{new Date(d.sentAt).toLocaleString()}</p>
                </div>
                <span className="status-pill pill-green">Sent</span>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// RECEIVED DOCUMENTS (Doctor)
// ═══════════════════════════════════════════════════════════════════
const ReceivedDocuments=()=>{
  const {user}=useAuth();
  const docs=Object.values(D.externalDocuments).flat().filter(d=>d.doctorId===user.id);
  return(
    <div className="space-y-4">
      <div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#059669,#10b981)'}}><IcoDoc cls="w-5 h-5 text-white"/></div>
        <div><h2 className="text-xl font-bold text-white">Received Documents</h2><p className="text-sm text-slate-400">Patient documents stored on Ethereum</p></div>
      </div>
      {docs.length===0?(<Card cls="p-8 text-center"><IcoDoc cls="w-10 h-10 text-slate-600 mx-auto mb-2"/><p className="text-slate-500 text-sm">No documents received yet.</p></Card>):docs.map(d=>(
        <Card key={d.id} cls="overflow-hidden">
          <div className="px-5 py-3 bg-slate-800/50 border-b border-slate-700/30 flex items-center justify-between">
            <p className="font-semibold text-slate-200">📄 {d.documentName}</p>
            <div className="flex items-center gap-2"><TxBadge txHash={d.txHash}/><span className="text-xs text-slate-500">{new Date(d.sentAt).toLocaleString()}</span></div>
          </div>
          <div className="p-5 space-y-3">
            <div className="flex items-center gap-2 p-2.5 rounded-lg" style={{background:'rgba(98,126,234,0.08)',border:'1px solid rgba(98,126,234,0.2)'}}>
              <IcoUser cls="w-4 h-4 text-indigo-400"/><div><p className="text-xs text-indigo-400 font-semibold uppercase tracking-wide">From Patient</p><p className="text-sm font-semibold text-indigo-200">{d.patientName}</p></div>
            </div>

            {d.attachment&&<a href={'data:'+d.attachment.mimeType+';base64,'+d.attachment.content} download={d.attachment.name} className="flex items-center gap-2 p-2.5 rounded-lg hover:opacity-80 transition-opacity" style={{background:'rgba(74,222,128,0.08)',border:'1px solid rgba(74,222,128,0.25)'}}><IcoClip cls="w-4 h-4 text-green-400"/><span className="text-sm text-green-300 font-medium">{d.attachment.name}</span></a>}

// PATIENT AUTHORIZATION
// ═══════════════════════════════════════════════════════════════════
const PatientAuthorization=()=>{
  const {user}=useAuth();
  const [reqs,setReqs]=useState([]);const [ok,setOk]=useState(null);
  const refresh=()=>setReqs((D.transferRequests[user.patientId]||[]).filter(t=>t.toUserRole==='doctor'&&t.status==='pending'));
  useEffect(()=>refresh(),[]);
  const auth=async(tid,did)=>{
    await api('/api/authorize-doctor',{method:'POST',body:JSON.stringify({patientId:user.patientId,doctorId:did})});
    const t=(D.transferRequests[user.patientId]||[]).find(x=>x.id===tid);if(t)t.status='approved';
    logAudit(user,'Authorize Doctor',did);
    setOk('Doctor authorized on-chain');setTimeout(()=>setOk(null),4000);refresh();
  };
  return(
    <div className="space-y-4">
      <h2 className="text-xl font-bold text-white">Authorize Doctor Access</h2>
      <Alert type="ok" msg={ok}/>
      {reqs.length===0?<Card cls="p-6 text-center text-slate-500 text-sm">No pending requests.</Card>:reqs.map(t=>(
        <Card key={t.id} cls="p-4 flex items-center justify-between gap-3">
          <div><p className="font-medium text-slate-200">{t.toUserName}</p><p className="text-sm text-slate-500">Requested by {D.users[t.fromUserId]?.name} · Severity: {t.severity}</p></div>
          <button onClick={()=>auth(t.id,t.toUserId)} className="btn-eth text-xs py-1.5 px-3"><IcoChain cls="w-3.5 h-3.5"/>Authorize ⛓</button>
        </Card>
      ))}
    </div>
  );
};

// DOCTOR MANAGEMENT (Receptionist)
// ═══════════════════════════════════════════════════════════════════
const DoctorManagement=()=>{
  const {user}=useAuth();
  const [doctors,setDoctors]=useState([]);const [show,setShow]=useState(false);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [form,setForm]=useState({username:'',password:'',name:'',specialization:'General Medicine',organization:user.organization||'',portal:user.portal||'hospital',role:'doctor'});
  const refresh=()=>setDoctors(Object.values(D.users).filter(u=>u.role==='doctor'&&u.organization===user.organization));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);
    if(D.users[form.username]){setErr('Username exists');return;}
    const e=validatePw(form.password);if(e.length){setErr(e.join(', '));return;}
    await api('/api/users',{method:'POST',body:JSON.stringify(form)});
    logAudit(user,'Add Doctor',form.name);
    setOk(form.name+' registered on-chain');setTimeout(()=>setOk(null),4000);
    setShow(false);setForm({username:'',password:'',name:'',specialization:'General Medicine',organization:user.organization||'',portal:user.portal||'hospital',role:'doctor'});
    refresh();
  };
  return(
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-xl font-bold text-white">Doctor Management</h2>
        <button onClick={()=>setShow(true)} className="btn-eth text-xs py-1.5 px-3"><IcoPlus cls="w-4 h-4"/>Add Doctor</button>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {show&&(
        <Card cls="p-5 space-y-3">
          <h3 className="font-semibold text-slate-200">New Doctor</h3>
          <div className="grid grid-cols-2 gap-3">
            <Inp type="text" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="Username" label="Username"/>
            <Inp type="text" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Full Name" label="Full Name"/>
            <div className="col-span-2"><Inp type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Password" label="Password"/></div>
            <div className="col-span-2">
              <label className="block text-xs text-slate-400 mb-1">Specialization</label>
              <select className="inp-dark" value={form.specialization} onChange={e=>setForm({...form,specialization:e.target.value})}>
                {organSystems.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={add} disabled={!form.username||!form.name||!form.password} className="btn-eth"><IcoChain cls="w-4 h-4"/>Register on Chain</button>
            <button onClick={()=>{setShow(false);setErr(null);}} className="btn-ghost">Cancel</button>
          </div>
        </Card>
      )}
      <div className="space-y-3">
        {doctors.map(d=>(
          <Card key={d.id} cls="p-4 flex items-center justify-between">
            <div><div className="flex items-center gap-2"><p className="font-semibold text-slate-200">{d.name}</p><TxBadge txHash={d.txHash}/></div><p className="text-sm text-indigo-400">{d.specialization}</p><p className="text-xs text-slate-500">{d.username}</p></div>
            <span className="status-pill pill-green">Active</span>
          </Card>
        ))}
      </div>
    </div>
  );
};

// PATIENT MANAGEMENT (Receptionist)
// ═══════════════════════════════════════════════════════════════════
const PatientManagement=()=>{
  const {user}=useAuth();
  const [patients,setPatients]=useState([]);const [show,setShow]=useState(false);
  const [ok,setOk]=useState(null);const [err,setErr]=useState(null);
  const [form,setForm]=useState({username:'',password:'',firstName:'',lastName:'',gender:'male',birthDate:'',email:'',phone:''});
  const refresh=()=>setPatients(Object.values(D.users).filter(u=>u.role==='patient'));
  useEffect(()=>refresh(),[]);
  const add=async()=>{
    setErr(null);
    if(D.users[form.username]){setErr('Username exists');return;}
    const e=validatePw(form.password);if(e.length){setErr(e.join(', '));return;}
    if(!form.firstName||!form.lastName||!form.birthDate||!form.email||!form.phone){setErr('All fields required');return;}
    const cnt=Object.keys(D.patients).length+1;
    const pid='patient-demo-'+String(cnt).padStart(3,'0');
    const ud={id:form.username,username:form.username,password:form.password,role:'patient',name:form.firstName+' '+form.lastName,portal:'patient',patientId:pid};
    D.users[form.username]=ud;
    D.patients[pid]={id:pid,name:[{family:form.lastName,given:[form.firstName]}],gender:form.gender,birthDate:form.birthDate,telecom:[{system:'email',value:form.email},{system:'phone',value:form.phone}],healthInfo:[],authorizedDoctors:[]};
    D.appointments[pid]=[];D.transferRequests[pid]=[];D.externalDocuments[pid]=[];
    if(_bcTx)D.users[form.username].txHash=(await _bcTx('registerUser',{userId:form.username,role:'patient',name:ud.name},120000,'Register Patient')).txHash;
    logAudit(user,'Add Patient',ud.name+' ('+pid+')');
    setOk('Patient registered on Ethereum. ID: '+pid);setTimeout(()=>setOk(null),5000);
    setShow(false);setForm({username:'',password:'',firstName:'',lastName:'',gender:'male',birthDate:'',email:'',phone:''});
    refresh();
  };
  return(
    <div className="space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-xl font-bold text-white">Patient Management</h2>
        <button onClick={()=>setShow(true)} className="btn-eth text-xs py-1.5 px-3"><IcoPlus cls="w-4 h-4"/>Add Patient</button>
      </div>
      <Alert type="ok" msg={ok}/><Alert type="err" msg={err}/>
      {show&&(
        <Card cls="p-5 space-y-3">
          <h3 className="font-semibold text-slate-200">New Patient</h3>
          <div className="grid grid-cols-2 gap-3">
            <Inp type="text" value={form.username} onChange={e=>setForm({...form,username:e.target.value})} placeholder="Username" label="Username"/>
            <Inp type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Password" label="Password"/>
            <Inp type="text" value={form.firstName} onChange={e=>setForm({...form,firstName:e.target.value})} placeholder="First Name" label="First Name"/>
            <Inp type="text" value={form.lastName} onChange={e=>setForm({...form,lastName:e.target.value})} placeholder="Last Name" label="Last Name"/>
            <div><label className="block text-xs text-slate-400 mb-1">Gender</label><select className="inp-dark" value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
            <Inp type="date" value={form.birthDate} onChange={e=>setForm({...form,birthDate:e.target.value})} label="Birth Date"/>
            <Inp type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="Email" label="Email"/>
            <Inp type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone" label="Phone"/>
          </div>
          <div className="flex gap-2">
            <button onClick={add} disabled={!form.username||!form.password||!form.firstName||!form.lastName||!form.birthDate||!form.email||!form.phone} className="btn-eth"><IcoChain cls="w-4 h-4"/>Register on Chain</button>
            <button onClick={()=>{setShow(false);setErr(null);}} className="btn-ghost">Cancel</button>
          </div>
        </Card>
      )}
      <div className="space-y-3">
        {patients.map(p=>(
          <Card key={p.id} cls="p-4 flex items-center justify-between">
            <div><div className="flex items-center gap-2"><p className="font-semibold text-slate-200">{p.name}</p><TxBadge txHash={D.users[p.id]?.txHash}/></div><p className="text-xs text-slate-500">{p.username} · {p.patientId}</p></div>
            <span className="status-pill pill-indigo">Active</span>
          </Card>
        ))}
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════
const Login=()=>{
  const [un,setUn]=useState('');const [pw,setPw]=useState('');
  const [loading,setL]=useState(false);const [err,setErr]=useState('');
  const {login}=useAuth();const {wallet,connect}=useBC();
  const go=async()=>{
    if(!un.trim()||!pw.trim())return;
    setL(true);setErr('');
    const r=await login(un,pw);
    if(!r.success)setErr(r.error);
    setL(false);
  };
  return(
    <div className="min-h-screen flex items-center justify-center p-6 login-bg">
      <div className="max-w-md w-full rounded-2xl shadow-2xl p-8 eth-glow" style={{background:'rgba(15,12,41,0.92)',border:'1px solid rgba(98,126,234,0.4)'}}>
        <div className="text-center mb-8">
          <div className="w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center" style={{background:'linear-gradient(135deg,#627eea,#8b5cf6)'}}><IcoEth cls="w-10 h-10 text-white"/></div>
          <h1 className="text-2xl font-bold text-white">Healthcare System</h1>
          <p className="text-slate-400 mt-1 text-sm">Powered by Ethereum Blockchain</p>
          <div className="mt-2 flex items-center justify-center gap-2">
            <span className="w-2 h-2 rounded-full bg-green-400 blink"></span>
            <span className="text-xs text-green-400 mono">Sepolia Testnet · Block #{SC.getBlock().toLocaleString()}</span>
          </div>
        </div>
        {/* Wallet Status */}
        <div className="mb-5 p-3 rounded-xl flex items-center gap-3" style={{background:'rgba(98,126,234,0.08)',border:'1px solid rgba(98,126,234,0.2)'}}>
          <IcoEth cls="w-5 h-5 text-indigo-400"/>
          {wallet?(
            <div className="flex-1 min-w-0">
              <p className="text-xs text-slate-400">Wallet Connected {wallet.simulated&&<span className="chain-badge chain-badge-warn ml-1">SIMULATED</span>}</p>
              <p className="mono text-indigo-300 text-xs">{short(wallet.address)} · {wallet.balance} ETH</p>
            </div>
          ):(
            <div className="flex-1"><p className="text-xs text-slate-400">No wallet connected</p></div>
          )}
          <button onClick={connect} className="btn-ghost text-xs py-1 px-2">
            {wallet?.simulated?'Use MetaMask':'Connect'}
          </button>
        </div>
        <div className="space-y-4">
          <div className="flex items-center p-3 rounded-lg focus-within:ring-1 ring-indigo-500 transition-all" style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(98,126,234,0.3)'}}>
            <IcoUser cls="w-5 h-5 text-slate-400 mr-2 flex-shrink-0"/>
            <input type="text" value={un} onChange={e=>setUn(e.target.value)} placeholder="Username" className="flex-1 outline-none text-sm bg-transparent text-slate-200 placeholder-slate-500" onKeyPress={e=>e.key==='Enter'&&go()}/>
          </div>
          <div className="flex items-center p-3 rounded-lg focus-within:ring-1 ring-indigo-500 transition-all" style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(98,126,234,0.3)'}}>
            <IcoLock cls="w-5 h-5 text-slate-400 mr-2 flex-shrink-0"/>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password" className="flex-1 outline-none text-sm bg-transparent text-slate-200 placeholder-slate-500" onKeyPress={e=>e.key==='Enter'&&go()}/>
          </div>
          {err&&<div className="p-3 rounded-lg text-red-400 text-sm" style={{background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)'}}>{err}</div>}
          <button onClick={go} disabled={loading||!un.trim()||!pw.trim()} className="btn-eth w-full justify-center">
            {loading?<><span className="spin">⟳</span> Signing in…</>:<><IcoEth cls="w-4 h-4"/>Sign In</>}
          </button>
          <p className="text-xs text-center text-slate-500 pt-1">doctor001 / password123 &nbsp;·&nbsp; patient001 / patient123</p>
        </div>
      </div>
      <footer className="absolute bottom-0 w-full text-center py-4 text-slate-500 text-sm">Publisher: <span className="font-bold text-indigo-400">Anudit Panthi</span></footer>
    </div>
  );
};

              <div className="rounded-xl overflow-hidden" style={{border:'1px solid rgba(74,222,128,0.3)'}}>
                <div className="px-5 py-3 flex items-center gap-2" style={{background:'linear-gradient(135deg,rgba(5,150,105,0.3),rgba(16,185,129,0.3))'}}><IcoDoc cls="w-4 h-4 text-white"/><span className="font-semibold text-white text-sm">Received Documents</span></div>
                <div className="p-5 flex items-center justify-between" style={{background:'rgba(10,10,30,0.6)'}}>
                  <p className="text-sm text-slate-300">You have <b className="text-green-400">{recvCount}</b> document{recvCount>1?'s':''} from patients.</p>
                  <button onClick={()=>setTab('received-docs')} className="btn-eth text-xs py-1.5 px-3">View All</button>
                </div>
              </div>
            )}
          </div>
        )}

        {tab==='explorer'&&<BlockchainExplorer/>}
        {tab==='profile'&&<ProfileManagement/>}
        {tab==='send-document'&&user.role==='patient'&&<SendExternalDocument/>}
        {tab==='received-docs'&&['doctor','clinical'].includes(user.role)&&<ReceivedDocuments/>}
        {tab==='appointments'&&user.role==='patient'&&<AppointmentBooking/>}
        {tab==='appointments'&&['doctor','clinical'].includes(user.role)&&<DoctorAppointments/>}
        {tab==='patient-data'&&['doctor','clinical','nurse'].includes(user.role)&&<PatientDataManagement/>}
        {tab==='data-transfer'&&['doctor','clinical','nurse'].includes(user.role)&&<DataTransfer/>}
        {tab==='authorize'&&user.role==='patient'&&<PatientAuthorization/>}
        {tab==='audit'&&<AuditLog/>}
        {tab==='doctors'&&user.role==='receptionist'&&<DoctorManagement/>}
        {tab==='patients'&&user.role==='receptionist'&&<PatientManagement/>}

        <footer className="mt-10 text-center text-slate-600 text-sm">Publisher: <span className="font-bold text-indigo-400">Anudit Panthi</span> · ⛓ Ethereum Blockchain</footer>
      </div>
      <TxToasts/>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════════
const App=()=>(
  <BCProvider>
    <AuthProvider>
      <AppContent/>
    </AuthProvider>
  </BCProvider>
);
const AppContent=()=>{
  const {user}=useAuth();
  const {bcTx}=useBC();
  useEffect(()=>{_bcTx=bcTx;},[bcTx]);
  return user?<Dashboard/>:<Login/>;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
